name: Preview de l'application complète

on:
  push:
    branches:
      - chatgpt/test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer exactement le dépôt
        uses: actions/checkout@v4
      - name: Préparer le site sans modifier l'application
        run: |
          mkdir -p _site
          cp -a index.html android outils README.md _site/
          if [ -f favicon.ico ]; then cp favicon.ico _site/; fi
      - name: Activer et préparer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publier les fichiers inchangés
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer l'aperçu
        id: deployment
        uses: actions/deploy-pages@v4
