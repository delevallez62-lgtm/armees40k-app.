<!-- ===== v93 : Missions & Layout, Peinture & Hobby ===== -->
<style id="x40k">

.gxtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}.gxtop input[type=search]{flex:1;min-width:180px;min-height:42px}

.gxtitle .gi{width:34px;height:34px;color:var(--tc)}.gxtitle .gi svg{width:32px;height:32px}.gxtitle h2{flex:1;margin:0;font-family:var(--fc);font-size:22px;color:#f1e3bd}.gxtitle small{display:block;font-family:var(--fs);font-size:15px;color:var(--mu);letter-spacing:0}
.gfd{border:1px solid color-mix(in srgb,var(--tc) 45%,rgba(216,180,94,.25));border-left:4px solid var(--tc);border-radius:14px;margin:0 0 12px;background:linear-gradient(180deg,#191b1f,#111214);overflow:hidden}
.gfh{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}.gfh .gi{width:28px;height:28px;color:var(--tc)}.gfh .gi svg{width:26px;height:26px}
.gfh b{flex:1;min-width:0;font-family:var(--fc);font-size:17px;color:#f1e3bd}.gfh small{color:var(--mu);font-family:var(--fs);font-size:15px;margin-left:6px}
.gfh .b{min-width:38px;min-height:38px;padding:0 8px}.gfh .car{color:var(--mu);transition:transform .15s}.gfd.open .gfh .car{transform:rotate(180deg)}
.gfb{padding:0 12px 12px;border-top:1px solid rgba(216,180,94,.18)}
.ggh{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-family:var(--fs);font-weight:700;font-size:16px;color:var(--gc,var(--gold));border-bottom:1px solid color-mix(in srgb,var(--gc,#d8b45e) 45%,transparent);padding-bottom:4px}.ggh span{margin-left:auto;font-size:13px;color:var(--mu)}
.gmi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;padding:9px 10px;margin:6px 0;border-radius:12px;border:1px solid rgba(216,180,94,.16);border-left:3px solid var(--gc,var(--gold));background:#101113;cursor:pointer}
.gmi:hover{border-color:color-mix(in srgb,var(--gc,#d8b45e) 70%,transparent)}
.gmi .th{flex:none;width:54px;height:42px;border-radius:8px;background:#22252a center/cover;border:1px solid rgba(216,180,94,.25)}
.gmi .tx{flex:1;min-width:0}.gmi b{display:block;font-family:var(--fs);font-size:17px;color:#f1e3bd}.gmi small{display:block;color:var(--mu);font-size:12.5px;line-height:1.35;margin-top:2px}
.gbd{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px;border:1px solid currentColor}
.gbd.u{color:#4aa3ff}.gbd.p{color:#c46be0}.gbd.n{color:#55c46e}
.gadd2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.gadd2 .b{min-height:40px}
.gln{border:1px solid rgba(216,180,94,.18);border-radius:10px;padding:8px;margin:8px 0;background:#0f1012}.gln .r{display:flex;gap:8px;align-items:flex-end}.gln .r label{margin:0}.gln .r label:first-child{flex:1}.gln .r input[type=number]{width:80px}
.gimg{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:10px;border:1px solid rgba(216,180,94,.3);margin:8px 0;background:#0b0c0d}
.gxbtn{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.gxbtn .b,.gxbtn a.b{min-height:42px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
/* Peinture & Hobby */
.ghtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px}.ghtabs button{min-height:46px;border-radius:12px;border:1px solid rgba(196,107,224,.4);background:#15171a;color:#e8dec6;font:inherit;font-family:var(--fs);font-weight:700;font-size:17px;cursor:pointer}.ghtabs button.on{background:linear-gradient(180deg,#d38cf0,#8c3fae);color:#1a0d22;border-color:#e6b3f7}
.gprog{height:10px;border-radius:6px;background:#22252a;overflow:hidden;margin:6px 0 12px;border:1px solid rgba(216,180,94,.2)}.gprog i{display:block;height:100%;background:linear-gradient(90deg,#8c3fae,#c46be0,#55c46e)}
.gchips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}.gchips button{flex:none;border-radius:99px;border:1px solid rgba(216,180,94,.3);background:#15171a;color:#e6dcc4;font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}.gchips button.on{background:var(--gold);color:#1a1307;border-color:#f0d58f}
.ghg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ghu{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(216,180,94,.25);border-top:3px solid var(--sc);background:#121316;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column}
.ghu .ph{height:110px;background:#3a3226 center/cover;background-blend-mode:multiply;background-color:#8a7656}
.ghu .ph{position:relative}.ghu .ph.no::after{content:"🖌";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;opacity:.55}.ghu .ph.no{background:radial-gradient(circle at 50% 40%,rgba(196,107,224,.35),transparent 70%),#15171a}
.ghu .in{padding:8px 10px}.ghu b{display:block;font-family:var(--fs);font-size:16px;line-height:1.15;color:#f1e3bd;text-transform:capitalize}.ghu small{color:var(--mu);font-size:12px}
.ghu .st{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px;color:#111;background:var(--sc)}
.ghu .sw{display:flex;gap:3px;margin-top:6px}.ghu .sw i,.gsw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35);flex:none}
.gpt{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;border:1px solid rgba(216,180,94,.18);background:#101113;margin:6px 0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.gpt .gsw{width:34px;height:34px;box-shadow:inset 0 -6px 10px rgba(0,0,0,.35),0 0 10px color-mix(in srgb,var(--pc) 45%,transparent)}
.gpt .tx{flex:1;min-width:0}.gpt b{display:block;font-family:var(--fs);font-size:17px;color:#f1e3bd}.gpt small{color:var(--mu);font-size:12.5px}
.gpt .stk{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;border:1px solid currentColor}.stk.ok{color:#55c46e}.stk.bas{color:#e8a43c}.stk.achat{color:#e0563f}
.gstep{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;border:1px solid rgba(196,107,224,.25);border-radius:12px;padding:8px;margin:8px 0;background:#0f1012}
.gstep .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#c46be0;color:#1a0d22;font-weight:800}
.gstep .f{display:grid;grid-template-columns:1fr 1fr;gap:6px}.gstep .f label{margin:0}.gstep .f .w2{grid-column:1/-1}
.gstep .mv{display:flex;flex-direction:column;gap:4px}.gstep .mv button{min-width:34px;min-height:32px;border-radius:8px;border:1px solid rgba(216,180,94,.3);background:#1b1d21;color:var(--gold);cursor:pointer}
@media(max-width:420px){.gstep .f{grid-template-columns:1fr}.ghg{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script>
(()=>{
const G=window.G40,XV=window.XV,GX=window.GX;if(!G||!XV||!GX)return;
const {ic,icFor,col,e2}=G;
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nk=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[’']/g,"'").trim();
const say=m=>{try{toast(m)}catch(_){}};
const conf=(t,p,ok,cb)=>{try{ask({t,p,ok,dg:1},cb)}catch(_){if(confirm(t))cb()}};
/* ================= MISSIONS & LAYOUT ================= */
const LAY=__LAYOUTS__;
const PDFU="https://assets.warhammer-community.com/fre_14-10_wh40k_event_companion-wb5phj6fmn-crcrxvr2qx.pdf";
const sxd=()=>window.__sxd||[],by=()=>window.__sxby||{},smap=()=>window.__sxsm||{},msd=()=>window.__msd||[],gr=()=>window.__sxgr||{};
const cats=()=>{try{return SYS.w40k.missions}catch(_){return[]}};
const KIND={sec:["bolt","#ff7a45"],pri:["target","#e0563f"],lay:["grid","#4aa3ff"],free:["folder","#d8b45e"]};
function mx(){if(!S.mx||typeof S.mx!=="object")S.mx={};const m=S.mx;["sx","ms","ly"].forEach(k=>{if(!m[k]||typeof m[k]!=="object"||Array.isArray(m[k]))m[k]={}});["csx","cms","cly"].forEach(k=>{if(!Array.isArray(m[k]))m[k]=[]});return m}
function folders(){if(!Array.isArray(S.mf))S.mf=[{id:"f-sec",nm:"Secondaire Armageddon",k:"sec"},{id:"f-pri",nm:"Primaire Armageddon",k:"pri"},{id:"f-lay",nm:"Layout Armageddon",k:"lay"}];
 if(!S.mfi||typeof S.mfi!=="object")S.mfi={};if(!S.mimg||typeof S.mimg!=="object")S.mimg={};return S.mf}
/* --- copie d'origine, puis application des modifications partout dans l'appli --- */
let OR=null;
function snap(){if(OR||!window.__sxd||!window.__msd)return;OR={sx:sxd().map(c=>clone(c)),sm:clone(smap()),ms:msd().map(m=>clone(m)),mso:{}};msd().forEach(m=>{OR.mso[m.id]=m})}
function reset(o,src){Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,clone(src))}
const T_F="À la fin de votre tour.",T_C="À la fin de votre phase de Commandement (ou à la fin de votre tour au cinquième round de bataille).";
function buildSx(c){const ln=c.k==="cnt"?{tx:c.tx||"",k:"cnt",pts:+c.pts||0,u:"fois",w:T_F}:{tx:c.tx||"",k:"chk",pts:+c.pts||0,w:T_F};if(c.k==="cnt"&&+c.cap)ln.cap=+c.cap;return{id:c.id,nm:c.nm||"Carte",en:"",g:c.g||"c",d:c.d||"",o:[ln],cust:1}}
const autoSm=c=>c.k==="cnt"?`${+c.pts||0} PdV par fois : ${c.tx||""}${+c.cap?` — maximum ${+c.cap} PdV`:""}`:`${+c.pts||0} PdV : ${c.tx||""}`;
function buildMs(c){return{id:c.id,cat:c.cat,nm:c.nm||"Mission",d:c.d||"",setup:[],cond:(c.lines||[]).filter(l=>l.tx).map(l=>({rd:l.mo==="cmd"?[2,3,4,5]:[1,2,3,4,5],w:l.mo==="cmd"?T_C:T_F,mo:l.mo==="cmd"?"cmd":"tour",r5:l.mo==="cmd",tx:l.tx,pts:+l.pts||0,k:l.k==="cnt"?"cnt":"chk"})),act:[],rules:[],cust:1}}
function applyMx(){snap();if(!OR)return;const m=mx(),A=sxd(),B=by(),SM=smap(),M=msd();
 A.length=0;Object.keys(SM).forEach(k=>delete SM[k]);Object.assign(SM,clone(OR.sm));
 OR.sx.forEach(o=>{const c=B[o.id];if(!c)return;reset(c,o);const v=m.sx[o.id];if(v){if(v.nm)c.nm=v.nm;if(v.d!=null)c.d=v.d;if(v.l)for(const p in v.l){const [a,i]=p.split("."),L=c[a]&&c[a][+i];if(L){if(v.l[p].tx!=null)L.tx=v.l[p].tx;if(v.l[p].pts!=null&&L.pts!=null)L.pts=+v.l[p].pts}}if(v.sm!=null)SM[o.id]=v.sm}if(!(v&&v.off))A.push(c)});
 m.csx.forEach(cc=>{const c=B[cc.id]||(B[cc.id]={});reset(c,buildSx(cc));SM[cc.id]=cc.sm||autoSm(cc);if(!cc.off)A.push(c)});
 M.length=0;
 OR.ms.forEach(o=>{const c=OR.mso[o.id];reset(c,o);const v=m.ms[o.id];if(v){if(v.nm)c.nm=v.nm;if(v.d!=null)c.d=v.d;if(v.l)for(const i in v.l){const L=c.cond[+i];if(L){if(v.l[i].tx!=null)L.tx=v.l[i].tx;if(v.l[i].pts!=null)L.pts=+v.l[i].pts}}}if(!(v&&v.off))M.push(c)});
 m.cms.forEach(c=>{if(!c.off)M.push(buildMs(c))})}
window.applyMx=applyMx;
const smTxt=s=>s==null?"":typeof s==="string"?s:[s.f?"Fixe : "+s.f:"",s.t?"Tactique : "+s.t:""].filter(Boolean).join(" · ");
const lineSum=c=>(c.cond||[]).map(l=>`${l.pts} PdV${l.k==="cnt"?" par objectif/élément":""}`).join(" · ");
let mOpen={"f-sec":1},mq="",mShowOff={};
const thumb=id=>S.mimg&&S.mimg[id]?`<span class="th" style="background-image:url('${S.mimg[id]}')"></span>`:"";
function secItems(f,q){const m=mx(),B=by(),GR=gr(),out=[];const all=[...OR.sx.map(o=>o.id),...m.csx.map(c=>c.id)];
 const off=all.filter(id=>(m.sx[id]&&m.sx[id].off)||(m.csx.find(c=>c.id===id&&c.off)));
 ["e","c","a"].forEach(g=>{const ids=all.filter(id=>!off.includes(id)&&B[id]&&B[id].g===g&&(!q||nk(B[id].nm+" "+B[id].d).includes(q)));if(!ids.length)return;const G=GR[g]||{nm:g,ic:"",c:"#d8b45e"};
  out.push(`<div class="ggh" style="--gc:${G.c}">${G.ic} ${e2(G.nm)}<span>${ids.length}</span></div>`+ids.map(id=>{const c=B[id],cu=m.csx.some(x=>x.id===id),pe=!!m.sx[id];return`<button class="gmi" style="--gc:${G.c}" data-x="sxed" data-id="${id}">${thumb(id)}<span class="tx"><b>${e2(c.nm)}${cu?'<span class="gbd n">Créée</span>':pe?'<span class="gbd p">Modifiée</span>':""}</b><small>${e2(smTxt(smap()[id])||c.d)}</small></span></button>`}).join(""))});
 return out.join("")+offList("sec",off.map(id=>[id,(B[id]||{}).nm]))+`<div class="gadd2"><button class="b p" data-x="sxnew">+ Nouvelle carte secondaire</button></div>`}
function priItems(f,q){const m=mx(),out=[],all=[...OR.ms.map(o=>OR.mso[o.id]),...m.cms.map(buildMs)],off=all.filter(c=>(m.ms[c.id]&&m.ms[c.id].off)||m.cms.some(x=>x.id===c.id&&x.off));
 cats().forEach(ct=>{const a=all.filter(c=>c.cat===ct.id&&!off.includes(c)&&(!q||nk(c.nm+" "+c.d).includes(q)));if(!a.length)return;
  out.push(`<div class="ggh" style="--gc:#e0563f">${ct.ic} ${e2(ct.fr)}<span>${a.length}</span></div>`+a.map(c=>{const cu=m.cms.some(x=>x.id===c.id),pe=!!m.ms[c.id];return`<button class="gmi" style="--gc:#e0563f" data-x="msed" data-id="${c.id}">${thumb(c.id)}<span class="tx"><b>${e2(c.nm)}${cu?'<span class="gbd n">Créée</span>':pe?'<span class="gbd p">Modifiée</span>':""}</b><small>${e2(lineSum(c))}${c.d?" — "+e2(c.d.slice(0,90))+(c.d.length>90?"…":""):""}</small></span></button>`}).join(""))});
 return out.join("")+offList("pri",off.map(c=>[c.id,c.nm]))+`<div class="gadd2"><button class="b p" data-x="msnew">+ Nouvelle mission primaire</button></div>`}
const layId=l=>"lay-"+l.p;
function layAll(){const m=mx();return[...LAY.map(l=>Object.assign({id:layId(l),off:!!(m.ly[layId(l)]||{}).off,nm:(m.ly[layId(l)]||{}).nm},l)),...m.cly]}
function layItems(f,q){const m=mx(),all=layAll(),off=all.filter(l=>l.off),out=[],grp={};
 all.filter(l=>!l.off&&(!q||nk([l.nm,l.a,l.b,l.ma,l.mb,"agencement "+l.L].join(" ")).includes(q))).forEach(l=>{const g=l.a?`${l.a} vs ${l.b}`:"Mes layouts";(grp[g]=grp[g]||[]).push(l)});
 for(const g in grp)out.push(`<div class="ggh" style="--gc:#4aa3ff">🗺 ${e2(g)}<span>${grp[g].length}</span></div>`+grp[g].map(l=>`<button class="gmi" style="--gc:#4aa3ff" data-x="lyed" data-id="${l.id}">${thumb(l.id)}<span class="tx"><b>${e2(l.nm||("Agencement "+l.L))}${l.u?'<span class="gbd u">Mis à jour</span>':""}${l.cu?'<span class="gbd n">Créé</span>':""}</b><small>${l.ma?`Missions : ${e2(l.ma)} / ${e2(l.mb)} · page ${l.p}`:e2(l.note||"")}</small></span></button>`).join(""));
 return out.join("")+offList("lay",off.map(l=>[l.id,l.nm||(l.a+" vs "+l.b+" — "+l.L)]))+`<div class="gadd2"><button class="b p" data-x="lynew">+ Nouveau layout</button><button class="b" data-x="pdfimp">📄 Importer le PDF officiel</button><button class="b" data-x="pdfall">🖼 Préparer toutes les images</button></div>`}
function freeItems(f,q){const a=(S.mfi[f.id]||[]).filter(n=>!q||nk(n.t+" "+n.d).includes(q));
 return(a.length?a.map(n=>`<button class="gmi" data-x="nted" data-f="${f.id}" data-id="${n.id}">${thumb(n.id)}<span class="tx"><b>${e2(n.t)}</b><small>${e2((n.d||"").slice(0,120))}</small></span></button>`).join(""):`<p class="mu">Dossier vide.</p>`)+`<div class="gadd2"><button class="b p" data-x="ntnew" data-f="${f.id}">+ Nouvel élément</button></div>`}
function offList(k,a){if(!a.length)return"";return`<div class="gadd2"><button class="b" data-x="offtog" data-k="${k}">${mShowOff[k]?"Masquer":"Voir"} les éléments supprimés (${a.length})</button></div>`+(mShowOff[k]?a.map(([id,n])=>`<div class="gxl"><b>${e2(n||id)}</b><button class="b" data-x="restore" data-k="${k}" data-id="${id}">Restaurer</button></div>`).join(""):"")}
function count(f){const m=mx();if(f.k==="sec")return sxd().length;if(f.k==="pri")return msd().length;if(f.k==="lay")return layAll().filter(l=>!l.off).length;return(S.mfi[f.id]||[]).length}
function folderHtml(f){const q=nk(mq),open=q||mOpen[f.id],[i,c]=KIND[f.k]||KIND.free;
 const body=open?(f.k==="sec"?secItems(f,q):f.k==="pri"?priItems(f,q):f.k==="lay"?layItems(f,q):freeItems(f,q)):"";
 return`<div class="gfd${open?" open":""}" style="--tc:${f.c||c}"><div class="gfh" data-x="ftog" data-id="${f.id}">${f.ic?icFor("x_"+f.id):ic(i)}<b>${e2(f.nm)}<small>${count(f)}</small></b><button class="b" data-x="fren" data-id="${f.id}" aria-label="Modifier le dossier">✎</button><button class="b x" data-x="fdel" data-id="${f.id}" aria-label="Supprimer le dossier">🗑</button><span class="car">▾</span></div>${open?`<div class="gfb">${body}</div>`:""}</div>`}
function misBody(){const F=folders().filter(f=>!f.hid),H=folders().filter(f=>f.hid);return F.map(folderHtml).join("")+(H.length?`<div class="gp"><h3>Dossiers supprimés</h3>${H.map(f=>`<div class="gxl"><b>${e2(f.nm)}</b><button class="b" data-x="frest" data-id="${f.id}">Restaurer</button></div>`).join("")}</div>`:"")}
XV.mis=()=>{applyMx();folders();return`<div class="gxtitle" style="--tc:${col("mis")}">${icFor("mis")}<h2>Missions &amp; Layout<small>Tes modifications s'appliquent partout : tirage des cartes, missions de partie et score.</small></h2></div>
 <div class="gxtop"><input type="search" id="gxmq" placeholder="Chercher une carte, une mission, un layout…" value="${e2(mq)}" autocomplete="off"><button class="b p" data-x="fnew">+ Nouveau dossier</button></div><div id="gxmb">${misBody()}</div>`};
/* --- fenêtres d'édition --- */
const imgBlock=id=>`<label>Image (photo, capture du layout…)<input type="file" accept="image/*" data-xi="${id}"></label>${S.mimg[id]?`<img class="gimg" src="${S.mimg[id]}" alt=""><div class="gxbtn"><button class="b x" data-x="imgdel" data-id="${id}">Retirer l'image</button></div>`:""}`;
let cur=null;
function sxEdit(id){const m=mx(),c=by()[id],cu=m.csx.find(x=>x.id===id),o=OR.sx.find(x=>x.id===id),sm=smap()[id];cur={k:"sx",id};
 const lines=[];if(!cu)["o","f","t"].forEach(a=>(c[a]||[]).forEach((L,i)=>lines.push([a+"."+i,a,L])));
 const smF=typeof sm==="object"&&sm?`<label>Résumé (Fixe)<textarea rows="2" data-f="smf">${e2(sm.f||"")}</textarea></label><label>Résumé (Tactique)<textarea rows="2" data-f="smt">${e2(sm.t||"")}</textarea></label>`:`<label>Résumé<textarea rows="2" data-f="sm">${e2(sm||"")}</textarea></label>`;
 GX.open(`<div class="gxh">${ic("bolt")}<h2>${e2(c.nm)}</h2><button class="b" data-gx="close">✕</button></div>

const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open("a40k-fichiers",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},

  if(!Object.keys(v.l).length)delete v.l;Object.keys(v).forEach(k=>v[k]===undefined&&delete v[k]);if(Object.keys(v).length)m.ms[i]=v;else delete m.ms[i];done("Mission modifiée partout dans l'appli");return}
