};
/* r(id, nom, alias, catégorie, faction, définition, fonctionnement, conditions, restrictions, source, statut, version) */
const ENC_BASE=(()=>{const r=(id,n,al,cat,fac,def,how,cond,rest,src,st,v)=>({id,n,al,cat,fac:fac||"",def,how:how||"",cond:cond||"",rest:rest||"",src:ENC_SRC[src][0],url:ENC_SRC[src][1],v0:v||ENC_VER,v:v||ENC_VER,chk:ENC_DATE,st});
return[
/* ---------- 1. Règles générales ---------- */
r("gen-mesure","Mesurer les distances",["mesure","distance","distances"],"gen","","On mesure en pouces (\"), à tout moment, depuis ou jusqu'à la partie la plus proche du socle de la figurine.","Une figurine CHÂSSIS se mesure depuis son point le plus proche (voir Châssis).","","","rdb","off"),
r("gen-des","Dés (D6, D3)",["d6","d3","2d6","des"],"gen","","Le jeu utilise des dés à six faces (D6). « 3+ » veut dire 3 ou plus ; un D3 est un D6 divisé par deux, arrondi au supérieur.","2D6 : on lance deux dés et on additionne. D6+1 : on ajoute 1 au résultat.","","","rdb","off"),
r("gen-cd","Jet de commandement",["commandement","cd","leadership","test de commandement","jet de commandement"],"gen","","On lance 2D6 : le jet réussit si le total est égal ou supérieur à la caractéristique de Commandement (Cd) de l'unité.","La règle qui demande le jet indique ce qui se passe en cas de réussite ou d'échec. Le jet d'ébranlement est un jet de commandement.","","","rdb","off"),
r("gen-ebranle","Ébranlé",["ebranle","ébranlée","test d'ebranlement","test d'ébranlement","jet d'ebranlement","battle-shock","battle-shocked","battleshock"],"gen","","Jet d'ébranlement = jet de commandement. Échec : l'unité devient ébranlée. Tant qu'elle l'est, la CO de ses figurines passe à « - », on ne peut pas la cibler avec ses propres stratagèmes et elle ne peut pas entreprendre (ni accomplir) d'action.","À l'étape d'Ébranlement de la phase de Commandement, le joueur actif fait un jet pour chaque unité ébranlée ou à demi-effectif ou moins. Une unité déjà ébranlée qui réussit cesse de l'être.","Unité ébranlée, ou à demi-effectif ou en dessous, au moment de l'étape d'Ébranlement.","Une unité ébranlée qui bat en retraite doit faire une fuite désespérée (voir Retraite).","rdb","off"),
r("gen-phases","Round de bataille et phases",["round","phases","tour de joueur","round de bataille"],"gen","","Un round de bataille = début du round, un tour par joueur, fin du round. Chaque tour : étape de Début de tour, 5 phases (Commandement, Mouvement, Tir, Charge, Combat), puis étape de Fin de tour.","Le même joueur joue toujours en premier à chaque round (la mission indique lequel). À la fin d'un tour ou d'un round, on résout d'abord les autres règles, puis les règles de mission.","","","rdb","off"),
r("gen-ph-cmd","Phase de Commandement",["phase de commandement","command phase"],"gen","","Étapes : début de phase, chaque joueur gagne 1 PC, jets d'ébranlement, aptitudes de Commandement, fin de phase.","À la fin de la phase, les règles de mission sont résolues après les autres règles.","","","rdb","off"),
r("gen-pc","Points de commandement (PC)",["pc","points de commandement","cp","command points","pc de base"],"gen","","Ressource dépensée pour utiliser des stratagèmes.","Chaque joueur gagne 1 PC « de base » à chaque phase de Commandement (la sienne et celle de l'adversaire).","","","rdb","off"),
r("gen-ph-mvt","Phase de Mouvement",["phase de mouvement","movement phase","mouvement normal","immobile","rester immobile"],"gen","","Chaque unité doit être choisie une fois : rester immobile, mouvement normal (jusqu'à M), avance, retraite, débarquement ou arrivée depuis la réserve.","Une figurine se déplace en lignes droites et pivots (le pivot ne compte pas). Elle traverse les figurines amies, jamais les ennemies, et ne sort pas de la table.","Mouvement normal : unité sur la table et non engagée ; elle doit finir non engagée.","Rester immobile ne déclenche pas les règles « quand une unité commence ou finit un mouvement ».","rdb","off"),
r("gen-avance","Avancer",["avance","advance","jet d'avance"],"gen","","Mouvement normal + 1D6\" (jet d'avance). L'unité doit finir non engagée.","Ensuite, l'unité ne peut tirer qu'avec ses armes d'Assaut (tir d'assaut).","Unité sur la table et non engagée.","Jusqu'à la fin du tour : pas de charge ni d'action.","rdb","off"),
r("gen-retraite","Retraite",["retraite","battre en retraite","fall back","fuite desesperee","retraite en bon ordre"],"gen","","Mouvement (jusqu'à M) qui permet à une unité engagée de quitter le combat. Deux modes : retraite en bon ordre (si l'unité n'est pas ébranlée) ou fuite désespérée.","Fuite désespérée : un jet de risque par figurine, les figurines peuvent traverser les ennemis, puis un jet d'ébranlement si l'unité ne l'est pas déjà.","L'unité est engagée ; elle doit finir non engagée.","Jusqu'à la fin du tour : pas de tir, de charge ni d'action.","rdb","off"),
r("gen-ph-tir","Phase de Tir",["phase de tir","shooting phase","tir","tir normal","tir d'assaut","tir en combat rapproche"],"gen","","Chaque unité éligible choisit un type de tir : normal (non engagée, sans avoir avancé), d'assaut (a avancé, armes Assaut seulement), en combat rapproché (engagée) ou indirect.","Résolution : choisir les armes, choisir les cibles (visibles, à portée, non engagées), puis jet de touche, de blessure, sauvegarde et dégâts.","","Après avoir tiré, l'unité ne peut plus entreprendre d'action pendant cette phase.","rdb","off"),
r("gen-touche","Jet de touche",["touche","jet de touche","hit roll","ct","cc","capacite de tir","capacite de combat"],"gen","","On lance un D6 par attaque : c'est une touche si le résultat est égal ou supérieur à la CT (tir) ou à la CC (mêlée).","Un 1 non modifié échoue toujours. Un 6 non modifié est une touche critique.","","","rdb","off"),
r("gen-crit","Touche et blessure critiques",["critique","touche critique","blessure critique","critical hit","critical wound"],"gen","","Un 6 non modifié au jet de touche est une touche critique ; un 6 non modifié au jet de blessure est une blessure critique. Elles comptent toujours comme réussies.","Elles déclenchent Touches fatales, Touches soutenues, Blessures dévastatrices… L'aptitude Anti- abaisse le seuil de la blessure critique.","","","rdb","off"),
r("gen-blessure","Jet de blessure",["blessure","jet de blessure","wound roll","force","endurance"],"gen","","On compare la Force (F) de l'attaque à l'Endurance (E) de la cible pour connaître le résultat à obtenir.","F ≥ 2×E : 2+ · F > E : 3+ · F = E : 4+ · F < E : 5+ · F ≤ E/2 : 6+.","","Un 1 non modifié échoue ; un 6 non modifié est une blessure critique.","rdb","off"),
r("gen-svg","Sauvegarde d'armure",["sauvegarde","svg","sv","save","pa","armour save","jet de sauvegarde"],"gen","","Le défenseur lance un D6 par blessure. On applique la PA de l'arme au résultat : s'il atteint la Sauvegarde (Sv) du groupe touché, l'attaque échoue.","Les jets se résolvent du plus bas au plus haut. On vérifie d'abord la sauvegarde invulnérable, puis l'armure.","","Un 1 non modifié échoue toujours.","rdb","off"),
r("gen-invu","Sauvegarde invulnérable",["invulnerable","invulnérable","svg invulnerable","sauvegarde invulnerable","invulnerable save","svin"],"gen","","Caractéristique SvIn : si le jet de sauvegarde (non modifié par la PA) atteint la SvIn, l'attaque échoue.","Elle est vérifiée avant la sauvegarde d'armure ; toutes les figurines n'en ont pas.","","","rdb","off"),
r("gen-degats","Dégâts",["degats","dégât","damage"],"gen","","Si l'attaque inflige des dégâts, la figurine choisie perd autant de PV que la caractéristique D ; à 0 PV elle est détruite.","On choisit si possible une figurine déjà blessée du groupe d'allocation en cours. Les attaques en trop sont perdues si l'unité est détruite.","","","rdb","off"),
r("gen-bm","Blessures mortelles",["blessure mortelle","bm","mortal wound","mortal wounds"],"gen","","Chaque blessure mortelle fait perdre 1 PV, sans jet de sauvegarde.","Ordre des figurines : non-PERSONNAGE déjà blessée, puis autre non-PERSONNAGE, puis PERSONNAGE blessé, puis PERSONNAGE.","","Si une attaque mélange dégâts normaux et blessures mortelles, les dégâts normaux passent d'abord.","rdb","off"),
r("gen-alloc","Allocation des attaques",["allocation","allouer","allocation des blessures","groupe d'allocation"],"gen","","Le défenseur répartit son unité en groupes : un par figurine de PERSONNAGE, et un par ensemble de figurines ayant les mêmes PV, Sv et SvIn. Il annonce ensuite l'ordre des groupes.","Un groupe (non PERSONNAGE) contenant une figurine blessée passe en premier. Les PERSONNAGES passent toujours après les autres, les blessés avant les intacts.","","Dans une unité attachée, on utilise l'Endurance la plus élevée des gardes du corps. L'aptitude Précision permet de viser un PERSONNAGE visible.","rdb","off"),
r("gen-vis","Visibilité (ligne de vue)",["visibilite","ligne de vue","visible","line of sight","entierement visible"],"gen","","Ligne imaginaire de 1 mm entre n'importe quelle partie des deux figurines, en ignorant les figurines de leurs propres unités. Visible : au moins une partie se voit ; entièrement visible : toute la face tournée vers l'observateur se voit.","Une unité est visible si au moins une figurine l'est ; entièrement visible si toutes le sont.","","Le terrain ajoute ses propres règles (Occultant, Plein, Caché).","rdb","off"),
r("gen-engag","Portée d'engagement",["portee d'engagement","engagement range","engagement"],"gen","","Zone à 2\" ou moins à l'horizontale et 5\" ou moins à la verticale d'une figurine.","Deux figurines adverses à portée d'engagement l'une de l'autre, ainsi que leurs unités, sont engagées.","","","rdb","off"),
r("gen-engage","Engagé",["engage","engagée","engaged","non engage"],"gen","","Une unité est engagée dès qu'une de ses figurines est à portée d'engagement (2\" / 5\" en vertical) d'une figurine ennemie ; sinon elle est non engagée.","Une unité engagée ne peut faire ni mouvement normal ni avance ; pour partir, elle doit battre en retraite.","","","rdb","off"),
r("gen-ph-charge","Phase de Charge",["phase de charge","charge","charger","jet de charge","charge phase"],"gen","","L'unité déclare une charge, lance 2D6 (distance maximale), puis choisit ses cibles : des ennemis à 12\" ou moins et à la distance obtenue ou moins.","Chaque figurine doit finir plus près d'une cible, à 1\" si elle le peut, et engagée si elle le peut. À la fin, l'unité doit être engagée avec toutes ses cibles et avec aucun autre ennemi.","Unité sur la table, non engagée, qui n'a ni avancé ni battu en retraite, avec un ennemi à 12\" ou moins.","L'unité qui a chargé a Combat en Premier jusqu'à la fin du tour. Un double 1 sans modificateur est toujours une charge ratée.","rdb","off"),
r("gen-ph-combat","Phase de Combat",["phase de combat","fight phase","combat","corps a corps","combattre"],"gen","","Étapes : s'insérer (joueur actif puis adversaire), combattre, consolider, puis fin de phase. Toute unité éligible doit combattre.","On commence par les unités qui Combattent en Premier, choisies à tour de rôle à partir du joueur dont c'est le tour, puis les autres unités. Éligible : unité engagée (ou qui l'était au début de l'étape) ou qui a chargé ce tour.","","Si toutes ses unités éligibles sont à plus de 5\" des ennemis, un joueur peut passer.","rdb","off"),
r("gen-insertion","Mouvement d'insertion",["insertion","mouvement d'insertion","pile in","pile-in","mouvement d'engagement"],"gen","","Mouvement de 3\" maximum fait à l'étape S'insérer (un seul par unité).","Cibles : les ennemis engagés, sinon des ennemis à 5\" ou moins. Les figurines au contact socle à socle ne bougent pas ; chaque figurine déplacée finit plus près de la cible la plus proche, engagée si possible.","Unité engagée, ou qui a chargé ce tour, ou choisie pour un combat de débordement.","L'unité doit finir engagée, et chaque figurine qui était engagée avec un ennemi doit le rester. Les anciens « mouvements d'engagement » sont des mouvements d'insertion.","rdb","off"),
r("gen-debord","Combat de débordement",["debordement","combat de debordement","overrun"],"gen","","Une unité éligible pour combattre mais non engagée (ou devenue engagée en cours de phase) fait un mouvement d'insertion supplémentaire, puis combat.","Les ennemis qu'elle engage ainsi deviennent éligibles pour combattre à cette phase.","L'unité doit être éligible pour combattre.","","rdb","off"),
r("gen-consol","Consolidation",["consolider","consolidation","consolidate"],"gen","","Mouvement de 3\" maximum à l'étape Consolider, pour toute unité qui était éligible pour combattre. Joueur actif d'abord, puis l'adversaire.","Mode obligatoire selon la situation : continue (encore engagée), d'engagement (ennemi à 3\" ou moins) ou sur objectif (objectif à 3\" ou moins).","","Consolidation d'engagement : chaque ennemi nouvellement engagé qui n'a pas encore combattu est aussitôt choisi pour combattre.","rdb","off"),
r("gen-coherence","Cohésion d'unité",["cohesion","coherence","cohésion d'unité","unit coherency"],"gen","","Chaque figurine doit être à 2\" (à l'horizontale, 5\" en vertical) d'au moins une autre figurine de l'unité, et à 9\" de toutes les autres.","Une unité doit être placée et finir chaque mouvement en cohésion.","","À l'étape de Fin de tour, on retire des figurines jusqu'à retrouver la cohésion ; elles sont détruites sans déclencher les règles de destruction.","rdb","off"),
r("gen-objectifs","Objectifs (zones de terrain)",["objectif","objectifs","pion objectif","objective","objectif de terrain"],"gen","","La mission indique où sont les objectifs. Chaque point doit tomber sur une zone de terrain : toute la zone est l'objectif (objectif de terrain).","Une figurine est à portée d'un objectif de terrain tant qu'elle est dans la zone. On mesure jusqu'à sa partie la plus proche.","","Si un point ne tombe pas sur une zone de terrain, voir Pion d'objectif.","rdb","off"),
r("gen-controle","Niveau de contrôle",["niveau de controle","controle","controle d'objectif","co","oc","objective control"],"gen","","À la fin de chaque phase et de chaque tour, chaque joueur additionne la CO de ses figurines à portée de l'objectif : le niveau le plus élevé contrôle l'objectif.","En cas d'égalité, personne ne le contrôle, sauf s'il est sécurisé. Une figurine ébranlée a une CO de « - ».","","","rdb","off"),
r("gen-obj-sec","Objectif sécurisé",["objectif securise","securise","secured"],"gen","","Un objectif sécurisé reste contrôlé par ce joueur, même sans unité à portée, jusqu'à ce que l'adversaire ait un niveau de contrôle supérieur à la fin d'une phase.","","","","rdb","off"),
r("gen-reserves","Réserves stratégiques",["reserve","reserves","reserves strategiques","strategic reserves"],"gen","","À l'étape Déclarer les formations de bataille, on peut garder des unités hors de la table, jusqu'à 50 % de la limite de points (unités embarquées comprises). Les FORTIFICATIONS ne peuvent pas y aller.","Elles arrivent par un mouvement d'arrivée, à partir du 2e round sauf mention contraire.","","Une unité qui n'est pas arrivée à la fin du 3e round est détruite, sauf unités repositionnées et unités dans un transport arrivé.","rdb","off"),
r("gen-arrivee","Mouvement d'arrivée",["arrivee","mouvement d'arrivee","ingress","ingress move","renforts"],"gen","","Placement depuis la réserve : entièrement à 6\" ou moins d'un ou plusieurs bords de table, et à plus de 8\" à l'horizontale de toute unité ennemie.","Avant le 3e round, aucune figurine ne peut être placée dans la zone de déploiement adverse.","Unité en réserve stratégique (pas une unité embarquée dans un transport lui-même en réserve).","Jusqu'à la prochaine phase de Charge, l'unité ne peut faire aucun autre type de mouvement.","rdb","off"),
r("gen-transport","Embarquer dans un transport",["embarquer","embarque","transport embarquement","capacite de transport"],"gen","","Après un mouvement normal, une avance ou une retraite, une unité peut embarquer si toutes ses figurines sont à 3\" ou moins du TRANSPORT.","Avant la bataille, une unité peut commencer embarquée (étape Déclarer les formations de bataille). Une unité embarquée n'est plus sur la table.","À partir du 1er round ; unité pas placée sur la table ce tour ; autorisée par la fiche du transport ; place suffisante.","","rdb","off"),
r("gen-debarq","Débarquer",["debarquer","debarquement","disembark","debarquement rapide","debarquement tactique","debarquement de combat"],"gen","","À sa phase de Mouvement, une unité embarquée se place selon un mode imposé : rapide (le transport a fait un mouvement normal ou d'arrivée, 3\"), tactique (transport immobile ou pas encore déplacé, 3\") ou de combat (sinon, 6\").","Tactique : l'unité fait ensuite un mouvement normal ou une avance. Combat : un jet de risque par figurine ; elle peut être placée engagée avec les ennemis engagés avec le transport.","Le transport est sur la table et n'a ni avancé ni battu en retraite cette phase ; l'unité n'a pas embarqué cette phase.","Rapide : pas de charge ce tour. Combat : l'unité devient ébranlée et ne peut pas charger ce tour.","rdb","off"),
r("gen-debarq-urg","Débarquement d'urgence",["debarquement d'urgence","emergency disembark"],"gen","","Quand un transport est détruit, chaque unité embarquée fait d'abord un jet de risque par figurine, puis se place entièrement à 6\" ou moins, aussi près que possible du transport.","Les figurines qui ne peuvent pas être placées sont détruites.","","L'unité devient ébranlée et ne peut pas charger ce tour.","rdb","off"),
r("gen-attachees","Unités attachées (meneur et appui)",["unite attachee","unites attachees","attached unit","garde du corps","gardes du corps","bodyguard"],"gen","","À l'étape Rassembler les armées, une unité Meneur et une unité d'Appui peuvent mener une unité de gardes du corps autorisée : elles forment une seule unité.","L'unité a tous les mots-clés de ses composantes (sans que chaque figurine les gagne). Contre elle, on utilise l'Endurance la plus élevée des gardes du corps (ou des meneurs s'il n'en reste plus).","Un Meneur et un Appui au maximum par unité de gardes du corps.","Les règles « quand l'unité est détruite » ne se déclenchent qu'à la mort de la dernière figurine présente au début. Une aptitude cesse quand la dernière figurine qui la donnait est détruite.","rdb","off"),
r("gen-danger","Jet de risque",["danger","jet de danger","hazard","hazard roll","risque","jet de risque"],"gen","","On lance un D6 : sur 1-2, l'unité subit 1 blessure mortelle (3 si toutes ses figurines sont MONSTRE ou VÉHICULE).","Demandé par les armes [À risque], la fuite désespérée, le débarquement de combat et le débarquement d'urgence. Plusieurs jets se font ensemble.","","","rdb","off"),
r("gen-doublons","Aptitudes dupliquées (cumul)",["cumul","aptitudes identiques","duplicates","aptitudes dupliquees"],"gen","","Plusieurs exemplaires d'une même aptitude de base ou d'arme ne se cumulent pas, même avec des valeurs ou des mots-clés différents : on choisit celui qui s'applique.","Pour les armes, le choix se fait à chaque attaque, à l'étape Choisir les armes.","","Éclaireurs : on doit prendre la plus petite valeur qui n'est pas commune à toutes les figurines.","rdb","off"),
r("gen-aura","Aptitudes d'aura",["aura"],"gen","","Une aptitude marquée « Aura » affecte les unités dans la portée indiquée. Une figurine est toujours à portée de sa propre aura.","Une unité peut subir plusieurs auras différentes.","","La même aura ne s'applique qu'une fois à une unité.","rdb","off"),
r("gen-strat","Stratagèmes",["stratageme","stratagemes","stratagem"],"gen","","On les utilise en dépensant des PC. Chacun indique son coût, QUAND, CIBLE, EFFET et parfois RESTRICTIONS.","Une option « +1PC » ne s'utilise qu'en payant ce supplément. Les stratagèmes de base sont accessibles à tous.","PC suffisants.","Un même stratagème au plus une fois par phase, et une même unité ciblée par un seul stratagème par phase. Une unité ébranlée ne peut pas être ciblée par ses propres stratagèmes.","rdb","off"),
/* ---------- 7. Terrain ---------- */
r("ter-zone","Zone et élément de terrain",["zone de terrain","element de terrain","terrain","decor","décors","terrain expose","expose"],"terr","","L'élément de terrain est le décor ; la zone de terrain est l'espace qu'il occupe (ou que délimite un tapis, un socle ou plusieurs décors).","Trois catégories : exposé (cratères, barbelés), léger (barricades, murs bas, statues) et dense (bâtiments, ruines, bois). Une même zone peut mélanger les catégories.","","","rdb","off"),
r("ter-occ","Occultant",["occultant","occultante","obscuring"],"terr","","Une zone qui contient au moins un élément léger ou dense est occultante. Si toutes les lignes de vue entre deux figurines traversent une zone occultante, elles ne se voient pas.","On ne compte pas la zone occultante dans laquelle se trouve l'une ou l'autre des deux figurines.","","","rdb","off"),
r("ter-couvert","Couvert",["couvert","benefice du couvert","cover","benefit of cover"],"terr","","Contre une attaque de tir, l'unité a le couvert si chacune de ses figurines est INFANTERIE/BÊTES/NUÉE dans une zone de terrain, ou n'est pas entièrement visible à cause de terrain interposé (élément ou zone occultante).","Effet : la CT de l'attaque est dégradée de 1.","","Ignore le couvert annule ce bénéfice (même celui de Discrétion). Le Tir indirect et l'Écran de fumée donnent le couvert.","rdb","off"),
r("ter-cache","Caché",["cache","cachee","hidden","portee de detection"],"terr","","Une figurine INFANTERIE/BÊTES/NUÉE est cachée si elle est dans une zone contenant au moins un élément dense et si son unité n'a fait aucune attaque de tir ce tour ni le tour précédent.","Une figurine cachée n'est visible que des ennemis à portée de détection (15\" sauf mention contraire).","Zone de terrain avec au moins un élément dense ; pas de tir ce tour ni au tour précédent.","","rdb","off"),
r("ter-plongeant","Tir plongeant",["tir plongeant","plunging fire"],"terr","","+1 à la CT d'une attaque de tir contre une unité visible ayant au moins une figurine au niveau du sol, si le tireur est sur une section de terrain de 3\" de haut ou plus.","Une figurine IMPOSANTE en profite même au sol, contre une cible à 12\" ou moins.","Cible visible avec au moins une figurine au niveau du sol.","Sans effet pour ou contre les AÉRODYNES.","rdb","off"),
r("ter-leger","Terrain léger et exposé",["obstacle leger","obstacles legers","mur bas","broussailles","terrain leger","leger"],"terr","","Toutes les figurines traversent librement le terrain exposé et léger, à l'horizontale comme à la verticale.","Le terrain léger peut fournir du couvert et rend la zone occultante ; le terrain exposé n'offre presque aucune protection.","","","rdb","off"),
r("ter-dense","Terrain dense (déplacement)",["terrain dense","dense"],"terr","","INFANTERIE, BÊTES, NUÉE et MOBILE traversent le terrain dense à l'horizontale ; seules INFANTERIE, BÊTES et NUÉE le traversent à la verticale.","Les autres figurines ne passent que par les sections de 2\" de haut ou moins ; sinon elles montent et descendent sans traverser plafonds ni planchers, et ne peuvent pas finir en hauteur.","","Finir en hauteur : seulement INFANTERIE/BÊTES/NUÉE/VOL/MONSTRE, stable, sans que le socle dépasse.","rdb","off"),
r("ter-solide","Plein",["solide","solid","plein"],"terr","","Les éléments de terrain dense ont la règle Plein : la ligne de vue ne passe pas par les ouvertures fermées (portes, fenêtres…) situées à 3\" ou moins du sol.","Une figurine ne peut pas finir un mouvement en dépassant à travers une partie fermée de l'élément à 3\" ou moins du sol.","","Certaines missions modifient cette hauteur de 3\".","rdb","off"),
/* ---------- 2. Mots-clés ---------- */
r("kw-infanterie","Infanterie",["infanterie","infantry"],"kw","","Mot-clé des fantassins.","Couvert et Caché dans les zones de terrain ; traverse le terrain dense à l'horizontale et à la verticale ; peut finir un mouvement en hauteur.","","","rdb","off"),
r("kw-betes","Bêtes",["bete","betes","beast","beasts"],"kw","","Mot-clé des créatures et des cavaliers légers.","Comme l'INFANTERIE : couvert, Caché, déplacement dans le terrain dense, fin de mouvement en hauteur.","","","rdb","off"),
r("kw-nuee","Nuée",["nuee","swarm"],"kw","","Mot-clé des essaims.","Comme l'INFANTERIE : couvert, Caché, déplacement dans le terrain dense, fin de mouvement en hauteur.","","","rdb","off"),
r("kw-vehicule","Véhicule",["vehicule","vehicle"],"kw","","Mot-clé des engins et blindés.","Mouvement normal ou avance : traverse les figurines amies et ennemies (sauf MONSTRES/VÉHICULES). Peut tirer en étant engagé (tir en combat rapproché) avec -1 au jet de touche, sauf armes de Combat rapproché contre l'unité qui l'engage.","","On peut lui tirer dessus quand il est engagé, avec -1 au jet de touche. Il ne passe que par les sections de terrain dense de 2\" ou moins.","rdb","off"),
r("kw-monstre","Monstre",["monstre","monster"],"kw","","Mot-clé des grandes créatures.","Mêmes règles de déplacement et de tir engagé que les VÉHICULES, mais un MONSTRE peut finir un mouvement en hauteur sur un décor.","","Un jet de risque raté inflige 3 blessures mortelles si toute l'unité est MONSTRE ou VÉHICULE.","rdb","off"),
r("kw-personnage","Personnage",["personnage","character","heros","héros"],"kw","","Mot-clé des héros et chefs.","Chaque PERSONNAGE forme son propre groupe d'allocation, toujours placé après les autres ; il subit les blessures mortelles en dernier. Il peut être Meneur.","","Précision et Défi épique permettent de cibler ou d'atteindre les PERSONNAGES.","rdb","off"),
r("kw-vol","Vol",["vol","fly","decoller","volant"],"kw","","Avant un mouvement normal, une avance, une retraite ou une charge, une unité VOLANTE peut décoller : -2\" à la distance maximale, mais elle ignore les distances verticales et traverse toutes les figurines et tous les terrains.","Une figurine VOLANTE peut finir un mouvement en hauteur. Stationnaire supprime la pénalité de 2\".","","","rdb","off"),
r("kw-aeronef","Aérodyne",["aeronef","aircraft","avion","aerodyne"],"kw","","Commence obligatoirement en réserve stratégique, ne fait que des mouvements d'arrivée et retourne en réserve à la fin du tour adverse.","Les autres unités peuvent le traverser. Il ne peut pas charger et ne combat que les unités VOLANTES ; seules elles peuvent le charger ou l'attaquer en mêlée.","","Le Tir plongeant ne s'applique pas. Être engagé seulement avec un AÉRODYNE n'empêche pas le mouvement normal ou l'avance.","rdb","off"),
r("kw-transport","Transport",["transport","transport assigne"],"kw","","Figurine capable d'embarquer d'autres unités selon sa capacité de transport (indiquée sur sa fiche).","Voir Embarquer, Débarquer et Débarquement d'urgence. Plusieurs unités peuvent partager un transport si la place suffit.","","","rdb","off"),
r("kw-imposant","Imposant",["imposant","imposante","towering"],"kw","","Les figurines IMPOSANTES bénéficient du Tir plongeant même au niveau du sol, contre une cible visible à 12\" ou moins.","","Cible visible à 12\" ou moins, avec des figurines au niveau du sol.","","rdb","off"),
r("kw-mobile","Mobile",["mobile"],"kw","","Les figurines MOBILES traversent le terrain dense à l'horizontale.","Un Marcheur super-lourd peut gagner MOBILE le temps d'un mouvement.","","","rdb","off"),
r("kw-chassis","Châssis",["chassis","frame"],"kw","","Pour une figurine CHÂSSIS, on mesure les distances depuis son point le plus proche, pas depuis son socle.","Sans socle, elle pivote sur son axe central.","","","rdb","off"),
r("kw-fortif","Fortification",["fortification"],"kw","","Mot-clé des bâtiments jouables.","Une FORTIFICATION ne peut pas être placée en réserve stratégique et ne peut pas entreprendre d'action.","","","rdb","off"),
r("kw-fumigenes","Fumée",["fumigene","fumigenes","smoke","fumee"],"kw","","Mot-clé des unités équipées de fumigènes : il permet d'utiliser le stratagème Écran de fumée.","","","","rdb","off"),

r("arm-assaut","Assaut",["assaut","assault"],"arm","","Une unité qui a avancé peut tirer (tir d'assaut), mais seulement avec ses armes d'Assaut.","","L'unité est non engagée.","","rdb","off"),
r("arm-lourd","Lourd",["lourd","lourde","heavy"],"arm","","À votre phase de Tir, +1 au jet de touche si l'unité est non engagée, n'a pas été placée ce tour et si aucune figurine ne s'est déplacée de plus de 3\" ce tour.","","Unité non engagée, pas placée ce tour, aucune figurine déplacée de plus de 3\".","","rdb","off"),
r("arm-tir-rapide","Tir rapide X",["tir rapide","rapid fire"],"arm","","+X dés d'attaque si la cible est à mi-portée de l'arme ou moins (au moment de choisir les cibles).","","Cible à mi-portée ou moins.","","rdb","off"),
r("arm-fuseur","Fusion X",["fuseur","melta","fusion"],"arm","","+X à la caractéristique de Dégâts si la cible est à mi-portée ou moins au moment de choisir les cibles.","Exemple : D6 devient D6+2 avec Fusion 2.","Cible à mi-portée ou moins.","","rdb","off"),
r("arm-ign-couvert","Ignore le couvert",["ignore le couvert","ignore couvert","ignores cover"],"arm","","La cible ne peut pas avoir le bénéfice du couvert contre ces attaques, y compris grâce à une règle comme Discrétion.","","","","rdb","off"),
r("arm-jumele","Jumelé",["jumele","jumelee","jumelées","touches jumelees","twin-linked","twin linked"],"arm","","On peut relancer le jet de blessure de chaque attaque.","","","","rdb","off"),
r("arm-fatales","Touches fatales",["touches fatales","touche fatale","lethal hits"],"arm","","Sur une touche critique, on peut choisir que l'attaque blesse automatiquement (sans jet de blessure).","Ce choix est facultatif : sans jet de blessure, pas de blessure critique possible (donc pas de Blessures dévastatrices).","","","rdb","off"),
r("arm-soutenues","Touches soutenues X",["touches soutenues","touche soutenue","sustained hits"],"arm","","Chaque touche critique donne X touches supplémentaires sur la cible.","Exemple : avec Touches soutenues 2, une touche critique compte comme 3 touches.","","","rdb","off"),
r("arm-devast","Blessures dévastatrices",["blessures devastatrices","blessure devastatrice","devastating wounds"],"arm","","Sur une blessure critique, la séquence d'attaque s'arrête et la cible subit autant de blessures mortelles que la caractéristique D de l'arme, après les dégâts normaux.","","","Chaque blessure critique ne peut endommager qu'une seule figurine : le surplus est perdu.","rdb","off"),
r("arm-anti","Anti-[MOT-CLÉ] X+",["anti-*","anti"],"arm","","Contre une cible ayant le mot-clé indiqué, un jet de blessure non modifié de X+ est une blessure critique.","Exemple : Anti-Véhicule 4+.","Cible avec le mot-clé indiqué.","Deux aptitudes Anti différentes ne se cumulent pas : on en choisit une.","rdb","off"),
r("arm-deflagration","Déflagration",["deflagration","blast","explosion"],"arm","","+1 dé d'attaque (ou +X avec Déflagration X) par tranche de 5 figurines dans l'unité ciblée, arrondi à l'inférieur.","Exemple : Déflagration 2 contre 12 figurines = +4 dés.","","Ne peut jamais cibler une unité engagée (même un MONSTRE/VÉHICULE engagé).","rdb","off"),
r("arm-cleave","Abattage X",["cleave","fendoir","abattage"],"arm","","En mêlée, si toutes les attaques de l'arme visent une seule unité : +X dés d'attaque par tranche de 5 figurines dans cette unité, arrondi à l'inférieur.","Exemple : Abattage 1, A3, contre 16 figurines = 6 dés.","Une seule cible pour toutes les attaques de l'arme.","","rdb","off"),
r("arm-torrent","Torrent",["torrent"],"arm","","Les attaques touchent automatiquement.","","","","rdb","off"),
r("arm-dangereux","À risque",["dangereux","dangereuse","hazardous","a risque"],"arm","","Après le tir ou le combat de l'unité, on fait un jet de risque par arme [À risque] choisie.","Voir Jet de risque.","","","rdb","off"),
r("arm-indirect","Tir indirect",["tir indirect","indirect fire","indirect"],"arm","","L'unité peut faire un tir indirect : ces armes peuvent viser des unités non visibles. La cible a alors le couvert et on ne peut pas relancer les jets de touche.","Un jet de touche non modifié de 1 à 5 échoue ; si l'unité est restée immobile et qu'une unité amie voit la cible, seul 1 à 3 échoue.","Unité non engagée qui n'a pas avancé.","","rdb","off"),
r("arm-pistolet","Combat rapproché / Pistolet",["pistolet","pistol","close-quarters","combat rapproche"],"arm","","L'unité peut tirer en étant engagée (tir en combat rapproché), avec ces armes seulement et sur les ennemis qui l'engagent.","Avec un autre type de tir, chaque figurine (sauf MONSTRE/VÉHICULE) utilise soit ses armes de combat rapproché, soit ses autres armes de tir. Pistolet est l'ancien nom de cette aptitude.","","","rdb","off"),
r("arm-precision","Précision",["precision"],"arm","","Au début de l'ordre d'allocation, si l'unité ciblée contient un PERSONNAGE visible, l'attaquant peut choisir son groupe : il devient le groupe en cours jusqu'à la fin des attaques ou sa destruction.","","PERSONNAGE visible d'au moins une figurine attaquante.","","rdb","off"),
r("arm-bonus","Attaques bonus",["attaques bonus","attaque bonus","extra attacks"],"arm","","Ces armes attaquent en plus : on choisit toutes les armes à Attaques bonus de la figurine, plus une autre de ses armes de mêlée si possible.","","","","rdb","off"),
r("arm-lance","Lance",["lance","lances"],"arm","","+1 au jet de blessure si l'unité a fait un mouvement de charge ce tour.","","","","rdb","off"),
r("arm-psy","Psychique",["psychique","psychic","psy"],"arm","","On peut ignorer tout ou partie des modificateurs de CT/CC et du jet de touche. Ces attaques sont des attaques psychiques.","Les blessures causées par une aptitude « Psychique » comptent aussi comme infligées par une attaque psychique.","","","rdb","off"),
r("arm-unique","Tir unique",["tir unique","one shot","usage unique"],"arm","","L'arme ne peut être choisie pour attaquer qu'une seule fois par bataille.","Une figurine ressuscitée ne récupère pas un tir unique déjà utilisé.","","","rdb","off"),
/* ---------- 3. Aptitudes générales ---------- */
r("apt-fep","Frappe en profondeur",["frappe en profondeur","fep","deep strike"],"apt","","Lors d'un mouvement d'arrivée, si toutes ses figurines ont l'aptitude, l'unité peut être placée n'importe où sur la table à plus de 8\" à l'horizontale des ennemis, même dans la zone de déploiement adverse.","Comme toute arrivée : pas avant le 2e round sauf mention contraire, et aucun autre mouvement avant la phase de Charge.","Toutes les figurines ont l'aptitude.","","rdb","off"),
r("apt-premier","Combat en premier",["combat en premier","frappe en premier","fights first"],"apt","","Si toutes ses figurines l'ont, l'unité combat avant celles qui ne l'ont pas.","Toute unité qui a fait un mouvement de charge l'a jusqu'à la fin du tour. Contre-offensive la donne aussi.","","","rdb","off"),
r("apt-fnp","Insensible à la douleur X+",["insensible a la douleur","fnp","feel no pain"],"apt","","Chaque fois que la figurine devrait perdre un PV, on lance un D6 : sur X+, ce PV n'est pas perdu.","","","","rdb","off"),
r("apt-infiltr","Infiltrateurs",["infiltre","infiltres","infiltrateurs","infiltrators"],"apt","","Au déploiement, si toutes ses figurines l'ont, l'unité peut se placer n'importe où à plus de 8\" à l'horizontale de la zone de déploiement adverse et de toute unité ennemie.","","Toutes les figurines ont l'aptitude.","","rdb","off"),
r("apt-scouts","Éclaireurs X\"",["scout","scouts","eclaireur","eclaireurs","mouvement d'eclaireur"],"apt","","Avant la bataille (aptitudes de prébataille) : l'unité en réserve peut se placer dans sa zone de déploiement, ou l'unité déployée fait un mouvement d'éclaireur de X\" et doit finir à plus de 8\" des ennemis.","Un TRANSPORT ASSIGNÉ dont tous les passagers ont Éclaireurs peut faire ce mouvement.","Toutes les figurines ont l'aptitude ; unité entièrement dans sa zone de déploiement.","Une unité ne peut pas embarquer après un mouvement d'éclaireur.","rdb","off"),
r("apt-discretion","Discrétion",["discretion","stealth","furtif"],"apt","","Si toutes ses figurines l'ont, l'unité a le bénéfice du couvert contre chaque attaque de tir.","","","Ignore le couvert annule cet effet.","rdb","off"),
r("apt-solitaire","Agent solitaire",["agent solitaire","solitaire","lone operative"],"apt","","Tant qu'elle n'est pas dans une unité attachée, l'unité n'est visible que des ennemis à 12\" ou moins (ou X\") et ne peut être visée par un Tir indirect que depuis cette distance.","","Unité non attachée.","","rdb","off"),
r("apt-demise","Destruction néfaste X",["explosion fatale","mort explosive","deadly demise","destruction nefaste"],"apt","","Quand une figurine est détruite (après le débarquement d'urgence de ses passagers), on lance un D6 : sur 6, chaque unité à 6\" ou moins subit X blessures mortelles.","Si X est aléatoire, on le lance pour chaque unité.","","","rdb","off"),
r("apt-poste-tir","Pont de tir X",["poste de tir","firing deck","pont de tir"],"apt","","Quand le TRANSPORT tire, il peut choisir jusqu'à X figurines embarquées ; chacune lui prête une arme de tir (sauf Tir unique) pour ses attaques.","","Unité(s) embarquée(s) ; figurines pas encore choisies pour tirer cette phase.","Les unités embarquées ne peuvent plus tirer ce tour.","rdb","off"),
r("apt-stationnaire","Stationnaire",["stationnaire","hover"],"apt","","Quand l'unité décolle (Vol), on ne retire pas 2\" à la distance maximale.","","","","rdb","off"),
r("apt-meneur","Meneur",["meneur","leader"],"apt","","Avant la bataille, l'unité peut mener une unité de gardes du corps autorisée et former une unité attachée.","Les associations possibles sont dans l'appli Warhammer 40,000. Voir Unités attachées.","","","rdb","off"),
r("apt-soutien","Appui",["soutien","support","appui"],"apt","","Comme Meneur : l'unité peut mener une unité de gardes du corps autorisée, en plus d'un éventuel Meneur.","Les associations possibles sont dans l'appli Warhammer 40,000. Voir Unités attachées.","","","rdb","off"),
r("apt-shw","Marcheur super-lourd",["marcheur super-lourd","super-heavy walker"],"apt","","Lors d'un mouvement normal, d'une avance ou d'une retraite, traverse les figurines (même MONSTRES/VÉHICULES, sauf TITANESQUES) et les sections de terrain de 4\" de haut ou moins.","Avant de bouger, l'unité peut gagner MOBILE pour ce mouvement ; sur 1 au D6 ensuite, elle devient ébranlée.","","","rdb","off"),
/* ---------- 9. Autres mécaniques (stratagèmes de base) ---------- */
r("str-relance","Relance de commandement",["relance de commandement","command re-roll"],"autre","","Stratagème de base, 1 PC : juste après un jet d'avance, de charge, de dégâts, de risque, de touche, de blessure, de sauvegarde ou de nombre d'attaques, on le relance.","Si plusieurs dés ont été lancés, on en relance un seul, sauf le jet de charge qui se relance en entier.","À n'importe quelle phase, pour une unité ou figurine amie.","","rdb","off"),
r("str-defi","Défi épique",["defi epique","epic challenge"],"autre","","Stratagème de base, 1 PC : quand une unité de PERSONNAGE est choisie pour combattre, les armes de mêlée d'une de ses figurines de PERSONNAGE gagnent Précision jusqu'à la fin de la phase.","","Phase de Combat.","","rdb","off"),
r("str-bravoure","Courage insensé",["bravoure insensee","insane bravery","courage insense"],"autre","","Stratagème de base, 1 PC : juste avant un jet d'ébranlement d'une unité amie, ce jet est automatiquement réussi.","","Étape d'Ébranlement de votre phase de Commandement.","Une seule fois par bataille.","rdb","off"),
r("str-impact","Impact écrasant",["impact ecrasant","crushing impact","choc de char"],"autre","","Stratagème de base, 1 PC : juste après la charge d'un MONSTRE/VÉHICULE ami, on choisit un ennemi engagé et une de ses figurines engagées, puis on lance autant de D6 que son Endurance.","Chaque 1 : votre unité subit 1 blessure mortelle. Chaque 5+ : l'unité ennemie subit 1 blessure mortelle (6 au maximum par unité).","Votre phase de Charge.","","rdb","off"),
r("str-arrivee","Arrivée précipitée",["arrivee rapide","rapid ingress","arrivee precipitee"],"autre","","Stratagème de base, 1 PC : à la fin de la phase de Mouvement adverse, une unité amie en réserve stratégique (sauf AÉRODYNE) fait un mouvement d'arrivée.","","","Interdit pendant le 1er round de bataille.","rdb","off"),
r("str-alerte","Tir en état d'alerte",["tir en etat d'alerte","tir en alerte","overwatch","fire overwatch"],"autre","","Stratagème de base, 1 PC : à la fin de la phase de Mouvement adverse, une unité amie non engagée (sauf TITANESQUE) tire au jugé.","Tir au jugé : une seule cible visible à 24\" ou moins, seuls les 6 non modifiés touchent, pas de relance des jets de touche.","","","rdb","off"),
r("str-fumee","Écran de fumée",["ecran de fumee","smokescreen"],"autre","","Stratagème de base, 1 PC : au début de la phase de Tir adverse, une unité amie à FUMÉE et les unités qu'elle masque ont le bénéfice du couvert jusqu'à la fin de la phase.","Masquée = pas entièrement visible du tireur à cause d'une figurine de l'unité à FUMÉE.","","","rdb","off"),
r("str-heroique","Intervention héroïque",["intervention heroique","heroic intervention"],"autre","","Stratagème de base, 1 PC : à la fin de la phase de Charge adverse, une unité amie non engagée à 12\" ou moins d'un ennemi résout une charge.","Mode « Bondir pour défendre » : cibles limitées aux ennemis qui viennent de charger. Mode « Dans la mêlée » (+1 PC) : jet de charge plafonné à 6, cibles à 6\" ou moins.","VÉHICULE seulement s'il est PERSONNAGE ou MARCHEUR.","","rdb","off"),
r("str-contre","Contre-offensive",["contre-offensive","contre offensive","counteroffensive"],"autre","","Stratagème de base, 2 PC : juste après qu'une unité ennemie a combattu, une unité amie éligible gagne Combat en Premier jusqu'à la fin de la phase et doit être votre prochaine unité à combattre.","","Étape Combattre de la phase de Combat adverse.","","rdb","off"),
/* ---------- 4. Aptitudes de faction (règles de Codex, non publiées sur Warhammer Community) ---------- */
r("fac-serment","Serment du Moment",["serment du moment","oath of moment"],"fac","Space Marines","Au début de votre phase de Commandement, choisissez une unité ennemie : jusqu'à votre prochaine phase de Commandement, les unités ADEPTUS ASTARTES peuvent relancer leurs jets de touche contre elle.","","Armée Adeptus Astartes.","Règle du Codex : elle n'est pas dans les documents de Warhammer Community (le pack Space Marines du 14/10/2026 ne la modifie pas). À vérifier dans ton Codex ou l'appli.","v10","verif","V10 (codex)"),
r("fac-reanim","Protocoles de réanimation",["protocoles de reanimation","reanimation","reanimation protocols"],"fac","Nécrons","Pendant votre phase de Commandement, chaque unité NÉCRONS peut réanimer des figurines détruites (D3 PV de figurines par unité en règle générale).","","","Règle du Codex : le Pack de faction Nécrons (30/09/2026) y fait référence sans la redéfinir. À vérifier dans ton Codex ou l'appli.","v10","verif","V10 (codex)"),
r("fac-synapse","Synapse",["synapse"],"fac","Tyranides","Les unités TYRANIDES proches d'une unité SYNAPSE font leurs tests d'ébranlement dans de meilleures conditions.","","À portée d'une unité SYNAPSE.","Règle du Codex : le Pack de faction Tyranides (14/10/2026) y fait référence sans la redéfinir. À vérifier dans ton Codex ou l'appli.","v10","verif","V10 (codex)"),
r("fac-waaagh","Waaagh!",["waaagh","waaagh!","waagh"],"fac","Orks","Une fois par bataille, au début de votre phase de Commandement : jusqu'à votre prochaine phase de Commandement, les ORKS peuvent charger après avoir avancé, gagnent +1 en Force et en Attaques au corps à corps et une sauvegarde invulnérable de 5+.","","Une fois par bataille.","Règle du Codex : aucun document Orks n'est publié sur Warhammer Community. À vérifier dans ton Codex ou l'appli.","v10","verif","V10 (codex)"),
/* ---------- Nouveautés (mise à jour Warhammer Community du 11/11/2026) — à valider dans l'appli ---------- */
r("str-explosifs","Explosifs (stratagème)",["stratageme explosifs","lancer de grenades"],"autre","","Stratagème de base, 1 PC : à votre phase de Tir, une unité amie à EXPLOSIFS/GRENADES non engagée, éligible pour tirer et qui n'a pas avancé, choisit une de ces figurines et un ennemi non engagé visible à 8\" ou moins.","On lance six D6 : chaque 4+ inflige 1 blessure mortelle à cette unité ennemie.","Votre phase de Tir ; unité qui n'a pas avancé.","","rdb","new"),
r("gen-tir-juge","Tir au jugé",["tir au juge","snap shot"],"gen","","Type de tir utilisé par Tir en état d'alerte : une seule cible ennemie visible à 24\" ou moins, chaque attaque ne touche que sur un 6 non modifié, sans relance des jets de touche.","La CT et les modificateurs ne comptent pas.","Seulement quand une règle l'autorise.","Après ce tir, l'unité ne peut plus entreprendre d'action pendant la phase.","rdb","new"),
r("gen-elan","Mouvement d'élan",["elan","mouvement d'elan","surge","surge move"],"gen","","Mouvement déclenché par certaines aptitudes : l'unité se dirige vers l'unité ennemie la plus proche et doit finir engagée avec elle si possible, sinon aussi près que possible.","La distance dépend de la règle qui l'autorise.","Règle déclenchée ; unité non ébranlée, non engagée et qui ne s'est pas déplacée cette phase.","Elle ne peut pas finir engagée avec un autre ennemi ni se déplacer à nouveau pendant la phase.","rdb","new"),
r("gen-actions","Actions",["action","actions","entreprendre une action"],"gen","","Tâches données par les missions : chaque action indique quand elle s'entreprend, quelles unités, combien de fois, quand elle s'accomplit et son effet.","Si l'unité se déplace (sauf insertion ou consolidation) ou quitte la table, l'action n'est pas accomplie.","Impossible si l'unité n'est pas sur la table, est AÉRODYNE/FORTIFICATION, ébranlée, a une CO de 0 ou « - », est engagée (sauf TITANESQUE), a avancé ou battu en retraite, ou a déjà entrepris une action ce tour.","Jusqu'à la fin du tour, l'unité ne peut ni tirer (sauf TITANESQUE) ni charger.","rdb","new"),

const LB={QUAND:"quand",CIBLE:"cible",EFFET:"effet",RESTRICTION:"restr",RESTRICTIONS:"restr"};
function parse(b){b=String(b||"");const re=/(?:^|\s)(QUAND|CIBLE|EFFET|RESTRICTIONS?)\s*:\s*/gi,m=[];let x;
 while((x=re.exec(b)))m.push({k:LB[x[1].toUpperCase()],s:x.index,e:re.lastIndex});
 const o={pre:"",quand:"",cible:"",effet:"",restr:""};
 if(!m.length){o.effet=b.trim();return o}
 o.pre=b.slice(0,m[0].s).trim();
 m.forEach((y,i)=>{const t=b.slice(y.e,i+1<m.length?m[i+1].s:b.length).trim();o[y.k]=o[y.k]?o[y.k]+"\n"+t:t});return o}
const compose=o=>[o.pre,o.quand&&"QUAND : "+o.quand,o.cible&&"CIBLE : "+o.cible,o.effet&&"EFFET : "+o.effet,o.restr&&"RESTRICTIONS : "+o.restr].filter(Boolean).join("\n");

const turnOf=q=>{const t=String(q||"").toLowerCase();if(/advers/.test(t))return"opp";if(/\bvotre\b|\bvos\b/.test(t))return"me";return""};
const phasesOf=(q,s)=>{const t=String(q||"")+" "+(s&&s.ph||"");return PHN.filter(p=>phRe(p).test(t)||(s&&s.ph&&String(s.ph).toLowerCase()===p.toLowerCase()))};
const TURN={me:"Votre tour",opp:"Tour adverse",both:"Les deux tours"};
let ced=null,pSrc="";

const cst=()=>(S.cst=S.cst||{});
const coreAll=()=>CORE.map(c=>Object.assign({},c,cst()[c.id]||{},{core:true,mod:!!cst()[c.id]}));
function fromList(s,i){const p=parse(s.body);return{core:false,i,name:s.name,cp:s.cp,pre:p.pre,quand:p.quand,cible:p.cible,effet:p.effet,restr:p.restr,ph:phasesOf(p.quand||s.body,s),turn:turnOf(p.quand),raw:s}}

/* ---- rendu d'une carte ---- */
const lines=t=>esc(t).replace(/\n/g,"<br>");
const chip=p=>`<span class="scc" style="--c:${PHC[p]}">${p}</span>`;
function when(o){const ph=o.ph||[],all=ph.length===PHN.length;
 if(!o.quand&&!ph.length)return"";
 const ch=(all?`<span class="scc" style="--c:#9aa7a0">Toute phase</span>`:ph.map(chip).join(""))+(o.turn?`<span class="scc t">${TURN[o.turn]}</span>`:"");
 return`<div class="sc-w"><div class="sc-wh"><span class="sc-l">Quand</span>${ch}</div>${o.quand?`<p>${lines(o.quand)}</p>`:""}</div>`}
const row=(l,t,c)=>t?`<div class="sc-r${c?" "+c:""}"><span class="sc-l">${l}</span><p>${lines(t)}</p></div>`:"";
function card(o,foot){const cp=String(o.cp==null?"":o.cp).trim().replace(/\s*ou\s*/i,"–"),c=o.ph&&o.ph.length&&o.ph.length<PHN.length?PHC[o.ph[0]]:"#e3bd62";
 return`<div class="sc${o.core?" core":""}" style="--c:${c}"><div class="sc-h"><span class="scp"><b>${esc(cp||"–")}</b><i>PC</i></span><div class="sc-t"><div class="sc-n">${esc(o.name||"Sans nom")}</div>${o.en?`<small>${esc(o.en)}</small>`:""}</div>${o.badge?`<span class="scv" title="Ajouté par la mise à jour officielle 1.1">${esc(o.badge)}</span>`:""}${o.mod?`<span class="scv m" title="Modifié par vous">Modifié</span>`:""}</div>${when(o)}${o.pre?`<p class="sc-pre">${lines(o.pre)}</p>`:""}${row("Cible",o.cible)}${row("Effet",o.effet)}${row("Restrictions",o.restr,"x")}${foot||""}</div>`}

/* ---- éditeurs ---- */
function spField(i,k,l,v,rows){return`<label>${l}<textarea data-sp="${i}.${k}" rows="${rows}">${esc(v)}</textarea></label>`}
function editListCard(L,o){const s=o.raw,i=o.i;
 return`<div class="sc ed"><div class="sc-f"><div class="row"><label style="flex:1">Coût (PC)<input data-sx="${i}.cp" inputmode="numeric" value="${esc(s.cp)}"></label><label style="flex:3">Nom<input data-sx="${i}.name" value="${esc(s.name)}"></label></div>
 <label>Détachement<select data-sx="${i}.det" style="width:100%"><option value=""${s.det?"":" selected"}>— Aucun —</option>${L.dets.map(d=>`<option value="${esc(d.name)}"${d.name===s.det?" selected":""}>${esc(d.name)}</option>`).join("")}</select></label>
 ${spField(i,"quand","Quand l'utiliser",o.quand,2)}${spField(i,"cible","Cible",o.cible,2)}${spField(i,"effet","Effet",o.effet,4)}${spField(i,"restr","Restrictions",o.restr,2)}
 <div class="sc-b"><button class="b p" data-act="sok">Terminé</button> <button class="b x" data-act="sdel" data-i="${i}">Supprimer</button></div></div></div>`}
function editCore(o){const id=o.id;
 const f=(l,k,rows)=>rows?`<label>${l}<textarea data-cx="${id}.${k}" rows="${rows}">${esc(o[k])}</textarea></label>`:`<label>${l}<input data-cx="${id}.${k}" value="${esc(o[k])}"></label>`;
 return`<div class="sc ed core"><div class="sc-f"><div class="row"><label style="flex:1">Coût (PC)<input data-cx="${id}.cp" value="${esc(o.cp)}"></label><label style="flex:3">Nom<input data-cx="${id}.name" value="${esc(o.name)}"></label></div>
 ${f("Quand l'utiliser","quand",2)}${f("Cible","cible",2)}${f("Effet","effet",4)}${f("Restrictions","restr",2)}
 <div class="sc-b"><button class="b p" data-act="cok">Terminé</button> ${o.mod?`<button class="b x" data-act="creset" data-i="${id}">Rétablir l'original</button>`:""}</div></div></div>`}

/* ---- filtres & groupes ---- */
function visible(o,q,pf){if(pf&&!(o.ph||[]).includes(pf))return false;if(q&&!(o.name+" "+(o.en||"")+" "+(o.pre||"")+" "+o.quand+" "+o.cible+" "+o.effet+" "+o.restr).toLowerCase().includes(q))return false;return true}
const grp=(k,df,title,n,inner)=>`<details class="pg" data-pk="${k}" data-pd="${df?1:0}"${(df?!pop.has(k):pop.has(k))?" open":""}><summary><b>${title}</b> <span class="mu">${n} stratagème${n>1?"s":""}</span></summary>${inner}</details>`;
function list(L,mg){const q=pq.toLowerCase().trim(),pf=pph||"",f=!!(q||pf||pSrc),pre=mg?"m:":"g:";let out="";
 if(pSrc!=="liste"){const cs=coreAll().filter(o=>visible(o,q,pf));
  if(cs.length||ced)out+=grp(pre+"@base",f,"Stratagèmes de base",cs.length,
   `<div class="sc-info"><p>Utilisables par toutes les armées. ${SRC_NOTE}</p><ul>${GEN.map(g=>`<li>${g}</li>`).join("")}</ul></div>`+cs.map(o=>ced===o.id&&mg?editCore(o):card(o,`<div class="sc-b">${mg?`<button class="b" data-act="cedit" data-i="${o.id}">Modifier</button>`:""}${o.enc&&window.encGo?`<button class="b" data-act="cenc" data-i="${o.enc}">Voir la règle</button>`:""}</div>`)).join(""))}
 if(pSrc!=="base"){const names=[...L.dets.map(d=>d.name),...L.strats.map(s=>s.det||"")].filter((n,i,a)=>a.indexOf(n)===i);
  names.forEach(n=>{const d=L.dets.find(x=>x.name===n),all=L.strats.map((s,i)=>[s,i]).filter(([s])=>(s.det||"")===n).map(([s,i])=>fromList(s,i)),ss=all.filter(o=>(mg&&sed===o.i)||visible(o,q,pf)),dm=d&&q&&(d.name+" "+d.rule).toLowerCase().includes(q);
   if(!ss.length&&!(dm&&!pf))return;const k=pre+n,df=false;
   out+=grp(k,df,esc(n||"Sans détachement"),ss.length,(d&&d.rule&&!pf?`<details class="pr" data-pk="r:${esc(n)}" data-pd="${q?1:0}"${(q?!pop.has("r:"+n):pop.has("r:"+n))?" open":""}><summary>Règle du détachement</summary><p class="pre">${esc(d.rule)}</p></details>`:"")+ss.map(o=>mg&&sed===o.i?editListCard(L,o):card(o,mg?`<div class="sc-b"><button class="b" data-act="sedit" data-i="${o.i}">Modifier</button> <button class="b x" data-act="sdel" data-i="${o.i}">Supprimer</button></div>`:"")).join(""))})}
 return out||`<p class="mu" style="text-align:center;margin:24px 0">${L.strats.length||pSrc!=="liste"?"Aucun stratagème ne correspond.":"Aucun stratagème dans cette liste (Gestion → Importer, ou + Stratagème)."}</p>`}

const bar=()=>`<div class="card psb"><input id="ps" type="search" placeholder="Chercher un stratagème…" value="${esc(pq)}" autocomplete="off"><div class="pph">${PH.map(([k,n])=>`<button class="${pph===k?"on":""}" data-act="pph" data-k="${k}">${n}</button>`).join("")}</div><div class="pph sseg">${[["","Tous"],["base","De base"],["liste","Ma liste"]].map(([k,n])=>`<button class="${pSrc===k?"on":""}" data-act="psrc" data-k="${k}">${n}</button>`).join("")}</div></div>`;

window.pstList=L=>list(L,tab==="strats");
window.pstView=L=>{if(!L)return pNone();return bar()+`<div id="pl">${list(L,false)}</div>`};
window.stView=L=>`<div class="card row" style="justify-content:space-between"><span><b>${L.strats.length} stratagème${L.strats.length>1?"s":""}</b> <span class="mu">+ ${CORE.length} de base</span></span><button class="b p" data-act="snew">+ Stratagème</button></div>`+bar()+`<div id="pl">${list(L,true)}</div>`;
/* function déclarées dans le script principal : on remplace aussi les liaisons globales */
try{pstList=window.pstList;pstView=window.pstView;stView=window.stView}catch(e){}

/* ---- actions ---- */
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-act=psrc],[data-act=cedit],[data-act=cok],[data-act=creset],[data-act=cenc]");if(!b)return;
 e.stopImmediatePropagation();e.preventDefault();const a=b.dataset.act;
 if(a==="psrc"){pSrc=b.dataset.k||"";draw();return}
 if(a==="cedit"){ced=b.dataset.i;draw();return}
 if(a==="cok"){ced=null;draw();return}
 if(a==="cenc"){const id=b.dataset.i;if(window.encGo)window.encGo(id);return}
 if(a==="creset"){const id=b.dataset.i;ask({t:"Rétablir l'original ?",p:"Vos modifications de ce stratagème seront perdues.",ok:"Rétablir",dg:1},()=>{delete cst()[id];ced=null;save();draw()})}
},true);
document.addEventListener("input",e=>{const t=e.target;if(!t||!t.dataset)return;
 if(t.dataset.sp){const[i,k]=t.dataset.sp.split("."),L=cl(),s=L&&L.strats[+i];if(s){const p=parse(s.body);p[k]=t.value;s.body=compose(p);save()}return}
 if(t.dataset.cx){const[id,k]=t.dataset.cx.split(".");if(!CORE.some(c=>c.id===id)||!CF.includes(k))return;const o=cst()[id]=cst()[id]||{};o[k]=t.value;save()}
},true);

/* pour les tests */
window.__st={CORE,parse,compose,turnOf,phasesOf,coreAll};
if(tab==="strats"||tab==="pst"){try{draw()}catch(e){}}
})();

</script>

const lid=p=>"lay-"+p;
const REV={};Object.keys(LP).forEach(k=>LET.forEach(l=>{if(LP[k][l])REV[lid(LP[k][l])]={k,l,p:LP[k][l],id:lid(LP[k][l])}}));
const mxo=()=>S.mx&&typeof S.mx==="object"?S.mx:{};
const itemOf=id=>{const m=mxo();if(REV[id])return(m.ly&&m.ly[id]&&m.ly[id].off)?null:Object.assign({},REV[id]);const c=(m.cly||[]).find(x=>x.id===id&&!x.off);return c?{k:c.ck||"custom",l:"★",p:0,id}:null};
const nm=L=>{const m=mxo(),id=L.id||lid(L.p);if(L.k==="custom"){const c=(m.cly||[]).find(x=>x.id===id);return(c&&c.nm)||"Mon layout"}return((m.ly&&m.ly[id]||{}).nm)||"Agencement "+L.l};
const img=L=>(S.mimg&&S.mimg[L.id||lid(L.p)])||(L.p?"lay/p"+L.p+".webp":"");
const poolFor=(cs,sel)=>{let it;const k=cs?key(cs[0],cs[1]):null;
 if(sel&&sel.length)it=sel.map(itemOf).filter(Boolean);else it=k&&LP[k]?LET.filter(l=>LP[k][l]).map(l=>itemOf(lid(LP[k][l]))).filter(Boolean):[];
 return it};
let open=false,leg=false,zoom=false,fresh=false;
const cat=id=>{try{return __ms.catG(id)}catch(e){return null}};
const cur=()=>{const r=S.games&&S.bat&&S.games.find(g=>g.id===S.bat.gid);return r&&!r.fin?r:null};
const catsOf=r=>r&&r.p&&r.p[0]&&r.p[1]&&r.p[0].mission&&r.p[1].mission?[r.p[0].mission.id,r.p[1].mission.id]:null;
const mk=(it)=>({k:it.k,l:it.l,p:it.p,id:it.id,t:Date.now()});

/* tirage : au lancement (les 2 catégories sont connues), parmi les layouts choisis pour la partie s'il y en a */
window.layDraw=function(c1,c2,sel){const cs=c1&&c2?[c1,c2]:null,pool=poolFor(cs,sel);if(!pool.length)return null;
 const k=cs?key(c1,c2):null,m=pool.filter(x=>x.k===k),src=m.length?m:pool,it=src[Math.floor(Math.random()*src.length)];
 open=false;leg=false;zoom=false;fresh=true;
 setTimeout(()=>{try{toast("Layout tiré au sort : "+nm(it)+" · onglet 🗺 à droite")}catch(e){}},1100);return mk(it)};

function html(r){const L=r.lay,cs=catsOf(r),a=cs&&cat(cs[0]),b=cs&&cat(cs[1]),pool=poolFor(cs,r.sel&&r.sel.lay);
 const ms=[0,1].map(i=>r.p[i]&&r.p[i].mission&&r.p[i].mission.mn?`<span>${esc(r.n[i]||"J"+(i+1))} : <b>${esc(r.p[i].mission.mn)}</b></span>`:"").filter(Boolean).join("");
 if(!L||!(L.p||L.id))return`<div class="lyh"><b>Layout de terrain</b><button class="lyx" data-ly="close" aria-label="Fermer">✕</button></div><p class="lyn">Aucun layout tiré pour cette partie.</p>${pool.length?`<button class="b p" data-ly="draw">🎲 Tirer un layout au sort</button>`:`<p class="lyn">Choisis la catégorie de mission des deux joueurs, ou des layouts dans la préparation de partie.</p>`}`;
 const chips=pool.filter(x=>x.k===L.k);
 return`<div class="lyh"><b>Layout — ${esc(nm(L))}</b><button class="lyx" data-ly="close" aria-label="Fermer">✕</button></div>
 <p class="lyn">${a&&b?esc(a.ic+" "+a.fr)+" <span class=mu>contre</span> "+esc(b.ic+" "+b.fr):""}</p>${ms?`<p class="lyn lym">${ms}</p>`:""}
 <div class="lyc">${chips.length>1?chips.map(x=>`<button class="${(x.id||"")===(L.id||lid(L.p))?"on":""}" data-ly="pick" data-id="${esc(x.id)}">${esc(x.l)}</button>`).join(""):""}<button data-ly="draw" title="Tirer un autre layout au sort">🎲 Retirer</button></div>
 <div class="lyi${zoom?" z":""}"><img src="${esc(img(L))}" alt="Layout ${esc(nm(L))}" data-ly="zoom" decoding="async"></div>
 <p class="lyn">Haut = bord de l'Attaquant (rouge) · bas = bord du Défenseur (bleu). Un dé décide qui est l'Attaquant. Touche l'image pour la voir en grand : pince pour zoomer, glisse pour la déplacer.</p>
 <button class="b" data-ly="leg">${leg?"Masquer la légende":"Légende des symboles"}</button>${leg?`<div class="lyi"><img src="lay/legende.webp" alt="Légende" decoding="async"></div>`:""}
 <p class="lyn mu">Source : Compagnon de Rencontre Warhammer, version 1.3.</p>`}


/* visionneuse plein écran : pincer pour zoomer, glisser pour déplacer, double appui pour agrandir */
(()=>{const st=document.createElement("style");st.textContent="#lyz{position:fixed;inset:0;z-index:95;background:#050607;display:flex;flex-direction:column;color:#eee;touch-action:none}#lyz .lzh{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#14161a;border-bottom:1px solid rgba(216,180,94,.4)}#lyz .lzh b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lyz .lzb{display:flex;gap:6px}#lyz .lzb button{min-width:46px;height:46px;border-radius:12px;border:1px solid rgba(216,180,94,.45);background:#1d2025;color:#f0d58f;font-size:22px;font-weight:700;cursor:pointer;touch-action:manipulation}#lyz .lzs{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}#lyz .lzs img{max-width:100%;max-height:100%;transform-origin:50% 50%;will-change:transform;pointer-events:none;-webkit-user-drag:none}#lyz .lzt{margin:0;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:#a89f8b;background:#14161a}";document.head.appendChild(st)})();
window.__zv=(src,alt)=>{const old=document.getElementById("lyz");if(old)old.remove();
 const o=document.createElement("div");o.id="lyz";o.setAttribute("role","dialog");o.setAttribute("aria-label","Layout en grand");
 o.innerHTML='<div class="lzh"><b></b><span class="lzb"><button type="button" data-z="-" aria-label="Dézoomer">−</button><button type="button" data-z="0" aria-label="Réinitialiser">⟲</button><button type="button" data-z="+" aria-label="Zoomer">+</button><button type="button" data-z="x" aria-label="Fermer">✕</button></span></div><div class="lzs"><img alt="" draggable="false"></div><p class="lzt">Pince pour zoomer · glisse pour déplacer · double appui pour agrandir</p>';
 o.querySelector("b").textContent=alt||"Layout";document.body.appendChild(o);
 const stg=o.querySelector(".lzs"),im=stg.querySelector("img");im.src=src;
 let sc=1,tx=0,ty=0;const P=new Map();let pd=0,ps=1,pm=null,lastTap=0;
 const clamp=()=>{sc=Math.max(1,Math.min(8,sc));if(sc===1){tx=ty=0;return}const mx=im.offsetWidth*sc/2,my=im.offsetHeight*sc/2;tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty))};
 const ap=()=>{clamp();im.style.transform="translate("+tx+"px,"+ty+"px) scale("+sc+")"};
 const zoomAt=(f,cx,cy)=>{const s2=Math.max(1,Math.min(8,sc*f)),k=s2/sc;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;sc=s2;ap()};
 const rel=(x,y)=>{const r=stg.getBoundingClientRect();return[x-r.left-r.width/2,y-r.top-r.height/2]};
 const close=()=>{document.removeEventListener("keydown",key,true);o.remove()};
 const key=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};document.addEventListener("keydown",key,true);
 o.addEventListener("click",e=>{const z=e.target.closest&&e.target.closest("[data-z]");if(!z)return;e.stopPropagation();const v=z.dataset.z;if(v==="x")close();else if(v==="0"){sc=1;ap()}else zoomAt(v==="+"?1.5:1/1.5,0,0)},true);
 stg.addEventListener("pointerdown",e=>{stg.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===2){const a=[...P.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;ps=sc;pm=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]}stg.style.cursor="grabbing"});
 stg.addEventListener("pointermove",e=>{const p=P.get(e.pointerId);if(!p)return;
  if(P.size===1){tx+=e.clientX-p[0];ty+=e.clientY-p[1];P.set(e.pointerId,[e.clientX,e.clientY]);ap()}
  else if(P.size===2){P.set(e.pointerId,[e.clientX,e.clientY]);const a=[...P.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1,m=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],c=rel(m[0],m[1]),k=Math.max(1,Math.min(8,ps*d/pd))/sc;tx=c[0]-(c[0]-tx)*k+(m[0]-pm[0]);ty=c[1]-(c[1]-ty)*k+(m[1]-pm[1]);sc*=k;pm=m;ap()}});
 const up=e=>{const was=P.size===1&&P.has(e.pointerId);P.delete(e.pointerId);stg.style.cursor="grab";
  if(was&&e.type==="pointerup"){const n=Date.now();if(n-lastTap<320){const c=rel(e.clientX,e.clientY);if(sc>1.2){sc=1;ap()}else zoomAt(2.5,c[0],c[1]);lastTap=0}else lastTap=n}};
 stg.addEventListener("pointerup",up);stg.addEventListener("pointercancel",up);
 stg.addEventListener("wheel",e=>{e.preventDefault();const c=rel(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.2:1/1.2,c[0],c[1])},{passive:false});
 ap()};

let tab_,pan;
function ensure(){if(tab_)return;tab_=document.createElement("button");tab_.id="layt";tab_.type="button";tab_.setAttribute("data-ly","toggle");tab_.setAttribute("aria-label","Layout de terrain");
 pan=document.createElement("div");pan.id="layp";document.body.appendChild(tab_);document.body.appendChild(pan)}
function upd(){ensure();const r=S.pm?cur():null;
 if(!r){tab_.hidden=true;pan.hidden=true;return}
 const ok=(r.lay&&(r.lay.p||r.lay.id))||poolFor(catsOf(r),r.sel&&r.sel.lay).length;
 tab_.hidden=!ok;if(!ok){pan.hidden=true;return}
 tab_.innerHTML=`<span>🗺</span><b>${r.lay?esc(r.lay.l||"?"):"?"}</b>`;tab_.classList.toggle("on",open);tab_.classList.toggle("new",fresh&&!open);
 pan.hidden=!open;if(open)pan.innerHTML=html(r)}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-ly]");if(!b)return;e.stopPropagation();e.preventDefault();
 const a=b.dataset.ly,r=cur();
 if(a==="toggle"){open=!open;fresh=false;upd();return}
 if(a==="close"){open=false;upd();return}
 if(a==="zoom"){window.__zv(b.getAttribute("src"),b.getAttribute("alt"));return}
 if(a==="leg"){leg=!leg;upd();return}
 if(!r)return;
 if(a==="pick"){const it=itemOf(b.dataset.id);if(it){r.lay=mk(it);r.lay.m=1;save();upd()}return}
 if(a==="draw"){const cs=catsOf(r),n=window.layDraw(cs&&cs[0],cs&&cs[1],r.sel&&r.sel.lay);if(n){r.lay=n;open=true;save();upd();toast("Layout tiré : "+nm(n))}}},true);

const _d=window.draw;window.draw=function(){const x=_d.apply(this,arguments);try{upd()}catch(e){}return x};
try{draw=window.draw}catch(e){}
window.__lay={LP,KEYS,key,cur,upd,isOpen:()=>open,poolFor,itemOf};
try{upd()}catch(e){}
})();

</script>
