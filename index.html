.exb2{min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:800;font-size:15px;cursor:pointer;touch-action:manipulation}.exb2.p{background:var(--ac);border-color:var(--ac);color:#fff}
/* éditeur de la carte de mission */
.jctop.ed{position:sticky;top:-12px;z-index:5;margin:-12px -12px 10px;padding:12px;background:rgba(5,12,9,.92);backdrop-filter:blur(6px);gap:8px}

.jctop:not(.ed) .jcs{flex:1}
.jee{border:1px solid color-mix(in srgb,var(--c) 45%,#cfc6b0);border-radius:12px;padding:10px;margin:10px 0 0;background:#fffdf4}
.jee label{display:flex;flex-direction:column;gap:3px;font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#6b6250;min-width:0}
.jee textarea,.jee input,.jee select{font:16px/1.3 system-ui,sans-serif;letter-spacing:0;text-transform:none;font-weight:400;color:#2b2519;background:#fff;border:1px solid #cfc6b0;border-radius:9px;padding:8px 9px;width:100%;box-sizing:border-box;min-width:0}
.jee textarea{resize:vertical;min-height:70px}.jee select{padding-right:4px}
.jee textarea:focus,.jee input:focus,.jee select:focus{outline:2px solid var(--cd);outline-offset:0}
.jeg{display:grid;grid-template-columns:96px 1fr;gap:8px}.jee>*+*{margin-top:8px}.jee>.jedel{margin-top:10px}
.jer>span{font:700 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#6b6250}.jer>div{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:3px}
.jer button{min-height:40px;border-radius:8px;border:1px solid #cfc6b0;background:#faf6ea;color:#a79d84;font:700 13px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}.jer button.on{background:var(--cd);border-color:var(--cd);color:#fff}.jer.off{display:none}
.jeb{padding-left:8px;border-left:3px solid var(--c);display:grid;gap:6px}.jeb>b{font:700 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--cd)}
.jedel{font-family:system-ui,sans-serif}
.jeadd{display:block;width:100%;min-height:48px;margin-top:12px;border-radius:12px;border:2px dashed var(--cd);background:transparent;color:var(--cd);font:800 14px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.jerst{border-color:#cfc6b0;color:#2b2519;font-family:system-ui,sans-serif}
.jced[data-jc=edit]{min-height:40px}
.jcmk{font-style:normal;color:var(--cd);font-size:11px}
.jcq.nt{font:700 12px system-ui,sans-serif;color:#6b6250;border:1px dashed #a79d84;padding:3px 9px;border-radius:99px}
@media(max-width:380px){.jced{padding:0 10px;font-size:12px}.jctop .jcs button,.jctop .jcs>span{padding:0 9px;font-size:12px}}

/* ===== v87 : la table de jeu ===== */
:root{--fd:"Big Shoulders Display","Oswald","Arial Narrow","Roboto Condensed",system-ui,sans-serif;--brass:#e3bd62}
.tbw{max-width:640px;margin:0 auto}

/* ----- le tapis ----- */

.tbm{position:relative;border-radius:17px;overflow:hidden;isolation:isolate;color:#e9f3ec;
 background:repeating-linear-gradient(0deg,rgba(214,255,232,.055) 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,rgba(214,255,232,.055) 0 1px,transparent 1px 24px),radial-gradient(130% 90% at 50% 50%,#26492f 0%,#183425 52%,#0f2119 100%);
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),inset 0 8px 20px rgba(0,0,0,.45)}
.tbm::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJz48ZmlsdGVyIGlkPSduJyB4PScwJyB5PScwJyB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nLjknIG51bU9jdGF2ZXM9JzInIHN0aXRjaFRpbGVzPSdzdGl0Y2gnLz48ZmVDb2xvck1hdHJpeCB2YWx1ZXM9Jy4zMyAuMzMgLjMzIDAgMCAuMzMgLjMzIC4zMyAwIDAgLjMzIC4zMyAuMzMgMCAwIDAgMCAwIDAgMScvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=");opacity:.2;mix-blend-mode:overlay}
.tbm>*{position:relative;z-index:1}

/* ----- les deux zones de déploiement ----- */
.tbz{box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"h s" "p s";gap:10px 12px;align-items:center;padding:14px 14px 16px}
.tbz::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 14px),linear-gradient(var(--dir,0deg),color-mix(in srgb,var(--c) 50%,transparent),color-mix(in srgb,var(--c) 9%,transparent) 90%)}
.tbz.o{--dir:180deg;border-bottom:2px dashed color-mix(in srgb,var(--cb) 55%,transparent)}
.tbz.m{--dir:0deg;border-top:2px dashed color-mix(in srgb,var(--cb) 55%,transparent)}
.tbz.sel::after{content:"";position:absolute;inset:5px;border-radius:13px;border:2px solid var(--cb);pointer-events:none;box-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 38%,transparent)}
.tbh{grid-area:h;display:flex;gap:6px;align-items:center;min-width:0}
.tbn{flex:1;min-width:0;height:42px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(rgba(0,0,0,.46),rgba(0,0,0,.3));color:#fff;font:700 16px/1 system-ui,-apple-system,sans-serif;box-shadow:inset 0 1px 4px rgba(0,0,0,.55)}
.tbn:focus{outline:2px solid var(--cb);outline-offset:1px}
.tbc{flex:none;width:44px;height:42px;display:grid;place-items:center;padding:0;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.13);color:#fff;cursor:pointer;touch-action:manipulation}.tbc:active{transform:scale(.95)}.tbc svg{display:block}
.tbp{grid-area:p;display:flex;align-items:center;gap:8px}
.tbpl{font:600 13px/1 system-ui,-apple-system,sans-serif;color:#b9cdc1;min-width:20px}
.tbp button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.12);color:#fff;font:600 24px/1 system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:0 0 2px;cursor:pointer;touch-action:manipulation}.tbp button:active{transform:scale(.92)}.tbp button:disabled{opacity:.32}
.tbpn{width:52px;height:46px;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);background:linear-gradient(165deg,#ffffff,color-mix(in srgb,var(--cb) 34%,#cfe0d6));color:#0d2218;font:900 27px/46px var(--fd);text-align:center;font-variant-numeric:tabular-nums}
.tbsc{box-sizing:border-box;grid-area:s;position:relative;min-width:96px;padding:7px 12px 15px;border-radius:15px;text-align:center;background:linear-gradient(rgba(0,0,0,.52),rgba(0,0,0,.34));border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 2px 7px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.08)}
.tbv{font:900 clamp(52px,17vw,68px)/.88 var(--fd);color:#fff;letter-spacing:.5px;text-shadow:0 0 18px color-mix(in srgb,var(--c) 75%,transparent),0 2px 0 rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.tbsc small{display:block;margin-top:3px;font:600 11.5px/1 system-ui,-apple-system,sans-serif;color:#b9cdc1}
.tbl{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);white-space:nowrap;padding:3px 10px;border-radius:99px;background:var(--brass);color:#2b1d03;font:800 12px/1.1 system-ui,-apple-system,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.tbv.pulse{animation:mspl .5s}
.tbz .msf{right:14px;top:6px;font:900 34px/1 var(--fd);color:var(--brass);text-shadow:0 2px 6px rgba(0,0,0,.6)}

/* ----- le rail des manches ----- */
.tbr{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:10px 8px 8px;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.22));border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
.tbj{border:0;background:none;padding:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;min-height:64px;touch-action:manipulation}
.tbjn{box-sizing:border-box;width:42px;height:42px;margin-top:3px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 23px/.85 var(--fd);color:#e7efe9;background:radial-gradient(circle at 35% 28%,#5b6d62,#2c3a32 58%,#18221c);box-shadow:0 2px 0 #08100b,inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s}
.tbjn em{font:700 10px/1 system-ui,-apple-system,sans-serif;font-style:normal;margin-bottom:2px;opacity:.7}
.tbj:active .tbjn{transform:scale(.92)}
.tbj.on .tbjn{width:48px;height:48px;margin-top:0;color:#2b1d03;background:radial-gradient(circle at 35% 28%,#fff1b8,#e3bd62 52%,#8a6420);box-shadow:0 0 0 3px rgba(227,189,98,.34),0 0 20px rgba(227,189,98,.55),0 2px 0 #4a3208}
.tbj.on .tbjn em{opacity:.7}
.tbj small{font:700 11.5px/1 system-ui,-apple-system,sans-serif;color:#a9bfb1;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbj small i{font-style:normal}
.tbj.on small{color:#fff}
.tbb{grid-column:1/-1;display:flex;height:4px;margin:4px 6px 0;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.08)}.tbb i{display:block;transition:width .25s}

/* ----- onglets des fiches ----- */
.tbs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 -1px;position:relative;z-index:1}
.tbs button{min-height:58px;border:1px solid var(--bd);border-top:4px solid color-mix(in srgb,var(--c) 38%,transparent);border-bottom:0;border-radius:14px 14px 0 0;background:color-mix(in srgb,var(--bd) 38%,var(--bg));color:var(--mu);font:inherit;cursor:pointer;padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation;min-width:0}
.tbs button .tbsn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 16px/1.15 system-ui,-apple-system,sans-serif;color:var(--tx)}
.tbs button small{font-size:12px;line-height:1.2;color:var(--mu)}
.tbs button.on{background:var(--card);border-color:var(--bd);border-top-color:var(--c);color:var(--tx);box-shadow:0 -4px 14px -6px color-mix(in srgb,var(--c) 55%,transparent)}
.tbs button.on small{color:var(--tx)}

/* ----- la fiche du joueur ----- */
.pdw.tbsh{border:1px solid var(--bd);border-radius:16px;overflow:visible;padding:2px 12px 16px;background:var(--card);box-shadow:var(--sh);margin-bottom:12px}
.pdw.tbsh[data-pl="0"]{border-top-left-radius:0}.pdw.tbsh[data-pl="1"]{border-top-right-radius:0}
.tbq{padding-top:12px}
.tbq+.tbq{margin-top:20px;padding-top:18px;border-top:1px dashed var(--bd)}
.tbqh{display:flex;align-items:center;gap:10px;margin:0}
.tbqi{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 16%,var(--card));border:1px solid color-mix(in srgb,var(--c) 42%,var(--bd))}
.tbqt{flex:1;min-width:0}.tbqt h3{margin:0;font:700 17px/1.2 system-ui,-apple-system,sans-serif;color:var(--tx)}.tbqt small{display:block;margin-top:2px;font-size:12.5px;line-height:1.2;color:var(--mu)}
.tbqs{display:flex;align-items:baseline;gap:5px;flex:none}.tbqs b{font:900 32px/1 var(--fd);color:var(--c);font-variant-numeric:tabular-nums}.tbqs small{font-size:12px;color:var(--mu)}
.tbmk{font-style:normal;font-size:13px;color:var(--mu);font-weight:600}
.tbsh .tbn0{margin-top:12px}

/* mission primaire */
.tbsh .msh{margin-top:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:11px 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 9%,var(--card));border:1px solid color-mix(in srgb,var(--c) 36%,var(--bd))}
.tbsh .msh .mi{font-size:28px;line-height:1}
.tbsh .msh .ml{margin:0!important;font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--mu);line-height:1.3}
.tbsh .msn1{font:700 19px/1.2 system-ui,-apple-system,sans-serif;display:block;margin-top:1px}
.mstb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 0}
.tbbt{min-height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13.5px/1.15 system-ui,-apple-system,sans-serif;cursor:pointer;padding:4px 6px;touch-action:manipulation}.tbbt:active{transform:scale(.97)}
.tbsh .pdr{margin:16px 0 0;align-items:center;font-size:13px}
.tbsh .pdr span:first-child{font:700 15px/1.2 system-ui,-apple-system,sans-serif}
.tbsh .pdr span:last-child{display:flex;align-items:baseline;gap:5px}.tbsh .pdr b{font:900 26px/1 var(--fd);color:var(--c)}
.tbsh .msg{margin:10px 0 0}
.tbsh .msgh{padding:4px 2px 0;font-size:13px;letter-spacing:0;text-transform:none;font-weight:700;color:var(--tx)}
.tbsh .msgh::before{content:"⏱";font-size:13px;opacity:.75}
.tbsh .msr{position:relative;border:1px solid var(--bd);border-radius:14px;padding:11px 12px;margin:8px 0 0;background:var(--card)}
.tbsh .msgh+.msr{border-top:1px solid var(--bd)}
.tbsh .msr.ok{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 11%,var(--card))}
.tbsh .msr1{grid-template-columns:auto minmax(0,1fr) auto;gap:12px}
.tbsh .mck{position:static;width:46px;height:46px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mu) 60%,var(--bd));background:color-mix(in srgb,var(--bd) 25%,transparent);font-size:22px;transition:transform .12s}
.tbsh .mck:active{transform:scale(.9)}
.tbsh .mck.on{border-color:var(--ac);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--ac) 62%,#fff),var(--ac));color:#fff}
.tbsh .mck:not(.sm)::after{content:"";position:absolute;inset:0;border-radius:14px}
.tbsh .mck.sm{width:30px;height:30px;font-size:16px;border-radius:50%}
.tbsh .msb2 .mck.sm{position:static}
.tbsh .mst{font-size:14.5px;line-height:1.35}
.tbsh .msp{font:900 30px/1 var(--fd)}.tbsh .msp small{font:600 11px/1.1 system-ui,-apple-system,sans-serif;margin-top:2px}
.tbsh .msq2{margin-top:8px}
.tbsh .stp2{gap:6px}.tbsh .stp2 button{width:42px;height:42px;border-radius:50%;font-size:21px}.tbsh .stp2 b{min-width:30px;font:800 24px/1 var(--fd);color:var(--tx)}
.tbsh .pdx{margin-top:10px;border:1px solid var(--bd);border-radius:12px;padding:0 12px;border-top:1px solid var(--bd)}.tbsh .pdx>summary{padding:12px 0;min-height:24px}.tbsh .pdx[open]>summary{border-bottom:1px solid var(--bd);margin-bottom:6px}

/* secondaires */
.tbsh .msel{margin-top:14px}
.tbsh .msel .ml{margin-bottom:8px;font:700 14.5px/1.3 system-ui,-apple-system,sans-serif;letter-spacing:0;text-transform:none;color:var(--tx)}
.tbsh .msel>p:last-child{margin:12px 0 0}
.tbsh .msel [data-ms=edone]{display:block;width:100%;min-height:48px;font-weight:700;font-size:15px}
.tbsh .dk{padding-top:0}
.tbsh .dkm{margin-top:12px}
.tbsh .dkb{font-size:15px;letter-spacing:0;font-weight:700;border-radius:14px;min-height:56px}
.tbsh .dks{margin:6px 2px 4px;font-size:13px}
.tbsh .dkc{border-radius:16px;border:1px solid var(--bd);border-left:6px solid var(--g);margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.tbsh .dkc>summary{padding:12px 12px 12px 10px}
.tbsh .dkg{width:40px;height:50px;border-radius:8px;font-size:20px;box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px color-mix(in srgb,var(--g) 55%,transparent)}
.tbsh .dkn b{font-size:16px}
.tbsh .dkp{min-width:44px;height:44px;border-radius:50%;justify-content:center;background:color-mix(in srgb,var(--g) 14%,var(--card));border:2px solid var(--g)}.tbsh .dkp b{font:900 24px/.9 var(--fd)}.tbsh .dkp small{font-size:9.5px;line-height:1}
.tbsh .dksm{font-size:13.5px}
.tbsh .dko{position:relative}
.tbsh .dko .mck{width:44px;height:44px}
.tbsh .dko .mck:not(.sm)::after{content:"";position:absolute;inset:0}
.tbsh .dkop{font:900 28px/1 var(--fd)}.tbsh .dkop small{font:600 10.5px/1.1 system-ui,-apple-system,sans-serif}

/* ----- la barre qui suit : scores + manches ----- */
.tbk{position:fixed;left:0;right:0;top:calc(var(--hh,48px) - 1px);z-index:4;max-width:980px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;background:#0b130f;border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 10px 22px rgba(0,0,0,.38);color:#fff;transform:translateY(-12px);opacity:0;visibility:hidden;transition:transform .18s ease,opacity .18s ease,visibility 0s .18s}
.tbk.on{transform:none;opacity:1;visibility:visible;transition:transform .18s ease,opacity .18s ease}
.tbkp{display:flex;align-items:center;gap:7px;height:42px;padding:0 10px 0 6px;border-radius:21px;border:2px solid transparent;background:rgba(255,255,255,.07);color:#fff;font:inherit;cursor:pointer;touch-action:manipulation}
.tbkp i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#06261a;font:800 15px/1 var(--fd);font-style:normal}
.tbkp b{font:900 28px/1 var(--fd);font-variant-numeric:tabular-nums;min-width:22px;text-align:center}
.tbkp.on{border-color:var(--cb);background:color-mix(in srgb,var(--c) 24%,transparent)}.tbkp b.pulse{animation:mspl .5s}

.dzcmp b{font-size:16px}.dzcmp .ctl2{display:inline-flex;align-items:center;gap:6px}.dzcmp .ctl2 button{width:30px;height:30px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:700 17px/1 system-ui,sans-serif;padding:0;cursor:pointer}

.dzp.final .dzcard,.dzp.final .dzt,.dzp.final .dzadj,.dzp.final .dzab,.dzp.final .dzcmp,.dzp.final .dzsx,.dzp.final .dzres,.final .dzcard,.final #dzt,.final #dzadj,.final #dzsx,.final #dzres{display:none!important}
.dzrc{display:grid;gap:8px}.dzrc .big{text-align:center;background:var(--bg);border-radius:12px;padding:10px 8px}
.dzrc .big b{display:block;font-size:46px;line-height:1;color:var(--ac)}.dzrc .big span{display:block;font-weight:700;font-size:14px;margin-top:4px}.dzrc .big small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.dzrc .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dzrc .g>div{border:1px solid var(--bd);border-radius:12px;padding:8px 6px;text-align:center;background:var(--card)}
.dzrc .g b{display:block;font-size:28px;line-height:1.1}.dzrc .g span{display:block;font-size:11.5px;color:var(--mu);line-height:1.25;margin-top:2px}.dzrc .g .z{opacity:.4}
.dzrc .dzbk{justify-self:center;min-height:30px;padding:0 14px;font-size:13px;opacity:.8}

.dzrc .big{padding:14px 8px}.dzrc .big b{font-size:64px;color:var(--tx)}.dzrc .big span{font-size:16px;margin-top:6px}
.dzrc .g{grid-template-columns:repeat(3,1fr);gap:6px}.dzrc .g b{font-size:26px}.dzrc .g .dm b{color:var(--ac)}.dzrc .g em{font-style:normal;font-size:11px;color:var(--mu)}

.dzrc{gap:7px}.dzrc .rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.dzrc .rw>div{min-width:0}.dzrc .rw i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--bd);color:var(--tx);font-size:11px;font-weight:700;margin-right:7px}
.dzrc .rw b{font-size:14.5px;font-weight:700}.dzrc .rw small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.dzrc .rw em{font-style:normal;font-weight:800;font-size:30px;line-height:1;min-width:48px;text-align:right}
.dzrc .rw.hero{background:var(--bg);padding:12px}.dzrc .rw.hero em{font-size:52px}
.dzrc .tot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--tx);color:var(--card)}
.dzrc .tot span{font-weight:800;font-size:15px;letter-spacing:.3px;text-transform:uppercase}.dzrc .tot small{display:block;font-size:12px;opacity:.75;margin-top:2px}
.dzrc .tot b{font-size:46px;line-height:1;min-width:56px;text-align:right}

/* récap dégâts v2 */
.dzrc{gap:8px}
.dzrc .r1{text-align:center;padding:14px 10px 12px;border-radius:16px;background:linear-gradient(var(--bg),color-mix(in srgb,var(--bd) 55%,var(--bg)));border:1px solid var(--bd)}
.dzrc .k{display:block;font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mu)}
.dzrc .r1 .n{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:2px}.dzrc .r1 .n b{font-size:68px;line-height:1;font-weight:800}.dzrc .r1 .n em{font-style:normal;font-size:20px;font-weight:700;color:var(--mu)}
.dzrc .r1 .s{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 10px}
.dzrc .r2{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border:1px dashed var(--bd);border-radius:10px;font-size:13px;color:var(--mu)}.dzrc .r2 b{color:var(--tx);font-size:14px}
.dzrc .r3{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
.dzrc .r3 .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.dzrc .r3 .tx{flex:1;min-width:0}.dzrc .r3 .tx .k{color:var(--tx);font-size:13px}.dzrc .r3 small{display:block;color:var(--mu);font-size:12.5px;margin-top:1px}
.dzrc .r3>b{font-size:36px;line-height:1;font-weight:800}.dzrc .r3.z{opacity:.45}
.dzrc .tot{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,var(--tx),color-mix(in srgb,var(--tx) 78%,var(--card)));color:var(--card);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.dzrc .tot>div{flex:1;min-width:0}.dzrc .tot .k{color:inherit;opacity:.85}.dzrc .tot small{display:block;font-size:12.5px;opacity:.9;margin-top:2px}
.dzrc .tot>b{font-size:50px;line-height:1;font-weight:800}.dzrc .tot>i{font-style:normal;font-size:13px;font-weight:700;opacity:.8;align-self:flex-end;margin-bottom:6px}
#dzs{position:fixed;z-index:39;left:8px;right:8px;bottom:64px;margin:0 auto;max-width:430px;max-height:calc(100vh - 80px);max-height:calc(100dvh - 80px);overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:14px;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;transform:translateY(18px) scale(.98);opacity:0;visibility:hidden;transition:transform .2s,opacity .2s,visibility 0s .2s}
#dzs.on{transform:none;opacity:1;visibility:visible;transition:transform .2s,opacity .2s}
#dzs *{box-sizing:border-box}
#dzs.bsy .dzb:not(.dzx){pointer-events:none}
#dzs [hidden]{display:none!important}
#dzs{z-index:41}.dzsu{text-transform:capitalize;margin:-4px 0 4px;color:var(--mu);font-size:13px;font-weight:600}
.svb{cursor:pointer;outline:1px dashed color-mix(in srgb,var(--mu) 55%,transparent);outline-offset:-3px}.svb:active{transform:scale(.96)}
.dzsc{margin-top:10px;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;background:var(--bg);display:grid;gap:8px}
.rowl{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px}.rowl>span,.lb>span{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.g6{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}.g6 .dzb{min-height:34px;padding:0;font-size:13.5px}
.dzsr{display:flex;justify-content:space-between;align-items:center;gap:10px}.lb{display:flex;align-items:center;gap:8px;min-width:0}.lb>span{white-space:nowrap}
.stp{display:inline-flex;align-items:center;gap:5px}.stp .dzb{width:34px;min-height:34px;padding:0;font-size:18px;flex:none}.stp b{min-width:30px;text-align:center;font-size:17px}
.dzsT{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--tx);color:var(--card)}
.dzsT span{display:block;font-weight:800;font-size:13px;letter-spacing:.4px;text-transform:uppercase}.dzsT small{display:block;opacity:.85;font-size:12.5px;margin-top:2px}.dzsT b{font-size:38px;line-height:1;font-weight:800}
.dzsres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.dzsres>div{border:1px solid var(--bd);border-radius:12px;padding:6px;text-align:center;background:var(--card)}.dzsres b{display:block;font-size:30px;line-height:1.1}.dzsres span{font-size:12px;color:var(--mu)}.dzsres .f{background:var(--bg)}
.dzsr.dz2{margin-top:8px;flex-direction:column;align-items:stretch;gap:6px}.dzsr.dz2 .lb{justify-content:space-between}.dzsdm{margin-top:8px;text-align:center;font-size:14px;color:var(--mu)}.dzsdm b{font-size:20px;color:var(--tx)}
.r2c{grid-template-columns:1fr 1fr!important}
#dzs .dzft .r3{display:grid;gap:6px;margin-top:7px}
.dzsvb{margin-top:4px!important}

/* ===== v88 thème table de jeu ===== */
/* ------------------------------------------------------------------
   v88 — thème « table de jeu » pour toute l'application
   Le cadre (en-tête, barre du bas) est le rebord sombre de la table,
   le contenu est posé dessus en plaques ; les chiffres utilisent la
   même police que le tableau des scores.
------------------------------------------------------------------- */
:root{--rim:linear-gradient(160deg,#33463b 0%,#16211b 42%,#0a110d 100%);--felt:radial-gradient(120% 140% at 50% 0%,#2c5a43 0%,#1d3d2d 55%,#12271c 100%);--r:16px;--rs:12px;--pl:var(--card);--tok:color-mix(in srgb,var(--bd) 42%,var(--bg));--focus:0 0 0 3px color-mix(in srgb,var(--ac) 40%,transparent)}
body{font-size:15px;-webkit-font-smoothing:antialiased}
main{padding-top:14px}

/* ===== en-tête : le rebord de la table ===== */
header{background:var(--rim);padding:12px 14px 10px;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.06);border-bottom:2px solid #0a110d}
header::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,rgba(227,189,98,.55),transparent);pointer-events:none}
header h1{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;row-gap:0;margin:0 0 10px;padding-right:48px;font:800 25px/1.05 var(--fd);letter-spacing:.4px;min-width:0}
header h1 small,header h1 #cl{margin:0;font:600 13px/1.3 system-ui,-apple-system,sans-serif;opacity:.78;letter-spacing:0;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header h1 #sy{font-size:13px;opacity:.7;align-self:center}
.hbn{top:10px;right:10px;display:flex;gap:4px}
.hbn button{width:36px;height:36px;min-height:36px;min-width:36px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:15px}
header:not(.hpl) nav{gap:6px;padding:2px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
nav::-webkit-scrollbar{display:none}
header:not(.hpl) nav>button{min-height:38px;padding:0 15px;border-radius:19px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#dfe9e3;font-weight:600;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
header:not(.hpl) nav>button:last-child{margin-right:28px}
header.hpl nav{-webkit-mask-image:none;mask-image:none;overflow:visible}
header:not(.hpl) nav>button.on{background:radial-gradient(circle at 35% 25%,#fff3c4,#e3bd62 55%,#a37a2c);border-color:#f1d68c;color:#2b1d03;font-weight:800;box-shadow:0 0 12px rgba(227,189,98,.35)}
header.hpl{padding:8px 10px 9px}
header.hpl h1{font-size:19px;margin:0 0 6px;padding-right:0}

/* bandeau de partie (score et PC en haut des écrans de jeu) */
.mbp{gap:8px}
.mbq{position:relative;background:var(--felt);border:1px solid rgba(255,255,255,.12);border-left:0;border-radius:14px;padding:6px 8px 7px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 6px rgba(0,0,0,.35);overflow:hidden}
.mbq::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--qc,#1fae7c)}
.mbq:nth-child(2){--qc:#e08a2c}
.mbl b{font:900 26px/1 var(--fd)}
.mbl small{opacity:.75}
.mbn{font-weight:700;font-size:13px;opacity:.95}
.mbc b{font:900 22px/1 var(--fd);min-width:24px;text-align:center}
.mbc button{width:36px;height:36px;min-height:36px;min-width:36px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);margin:0;padding:0;font-size:20px;line-height:1}

/* ===== barre du bas (en partie) ===== */
#bar{background:var(--rim);border-top:1px solid #0a110d;box-shadow:0 -6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
#bar button{color:#a9bdb1;font-size:11px;font-weight:600;border-radius:12px;padding:6px 2px 5px;margin:0 2px;min-height:52px}
#bar button i{font-size:21px}
#bar button.on{color:#f3dc9a;background:rgba(227,189,98,.13);box-shadow:inset 0 0 0 1px rgba(227,189,98,.35)}
#bar button:not(.on):not(.end) i{filter:grayscale(1) brightness(1.4);opacity:.7}
#bar button.end{color:#ff8a80}

/* bouton « Mode jeu » */
#fab{background:linear-gradient(180deg,#2fc488,#1c8c64);border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35),0 0 0 3px rgba(227,189,98,.35);font-size:15px;padding:14px 20px;min-height:52px}

/* ===== plaques (cartes) ===== */
.card,.pu,.pg{border-radius:var(--r);border:1px solid var(--bd);background:var(--pl);box-shadow:0 2px 10px rgba(0,0,0,.1),inset 0 1px 0 color-mix(in srgb,#fff 6%,transparent)}
.card{padding:14px}
.grid{gap:12px}
.mu{line-height:1.4}
h2{font:800 26px/1.1 var(--fd);letter-spacing:.3px}
h4{font-weight:800}

/* barre d'outils en tête d'écran (« 3 unités · … » + boutons) */
main>.card.row:first-child{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--ac) 7%,var(--card));border-color:color-mix(in srgb,var(--ac) 28%,var(--bd))}
main>.card.row:first-child>b,main>.card.row:first-child>span:first-child>b{font:800 22px/1.1 var(--fd);letter-spacing:.3px}
main>.card.row:first-child>span:last-child:not(:first-child){grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
main>.card.row:first-child>span:last-child .b{margin:0;width:100%}
main>.card.row:first-child>span:last-child .b.p{order:-1;grid-column:1/-1}
main>.card.row:first-child>.b.p{white-space:nowrap}

/* ===== boutons ===== */
.b{min-height:44px;padding:0 14px;border-radius:var(--rs);border:1px solid var(--bd);background:color-mix(in srgb,var(--bd) 22%,var(--card));color:var(--tx);font-weight:650;font-size:14.5px;box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 8%,transparent),0 1px 2px rgba(0,0,0,.08);transition:transform .1s,filter .15s;touch-action:manipulation}
.b:active{transform:scale(.97)}
.b.p{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 82%,#fff),var(--ac) 55%,color-mix(in srgb,var(--ac) 80%,#000));border-color:color-mix(in srgb,var(--ac) 70%,#000);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 10px color-mix(in srgb,var(--ac) 35%,transparent)}
.b.x{background:transparent;border-color:color-mix(in srgb,#d64541 35%,var(--bd));color:#d64541;padding:0 12px}
.b:focus-visible,nav button:focus-visible,#bar button:focus-visible{outline:none;box-shadow:var(--focus)}
.xx{width:32px;height:32px;top:8px;right:8px;font-size:13px;background:color-mix(in srgb,var(--bd) 30%,var(--card))}

/* ===== champs ===== */
input,textarea,select{border-radius:var(--rs);border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 70%,var(--card))}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),select{min-height:44px;padding:8px 12px}
textarea{padding:10px 12px;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:var(--focus)}
label{font-weight:600}
.psb{background:transparent;border:0;box-shadow:none;padding:0 0 4px}
.psb input{min-height:48px;border-radius:24px;padding:0 18px 0 42px!important;background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%238fa398' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4-4'/></svg>") no-repeat 15px 50%;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.psb .row{gap:8px}
.psb .row .b{flex:1;margin:0;min-height:42px!important}
.psb .row .mu{flex-basis:100%;text-align:center}

/* ===== mes listes ===== */
main>.grid>.card:has(>[data-act=gstart]){display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px;padding:0 14px 14px;overflow:hidden;position:relative}
main>.grid>.card:has(>[data-act=gstart])>*:not(.b){grid-column:1/-1;margin:0}
main>.grid>.card:has(>[data-act=gstart])>b:first-child{margin:0 -14px 6px;padding:16px 14px 14px;background:var(--felt);color:#fff;font:800 26px/1.05 var(--fd);letter-spacing:.3px;border-bottom:2px solid #0a110d;box-shadow:inset 0 -1px 0 rgba(227,189,98,.45);text-shadow:0 2px 6px rgba(0,0,0,.45)}
main>.grid>.card:has(>[data-act=gstart])>p{margin:2px 0 4px}
main>.grid>.card:has(>[data-act=gstart])>p:empty{display:none}
main>.grid>.card:has(>[data-act=gstart])>.b{margin:0;width:100%;padding:0 6px}
main>.grid>.card:has(>[data-act=gstart])>[data-act=gstart]{grid-column:1/-1;min-height:50px;font-size:16px;margin-top:6px}

/* ===== fiches d'unités (liste) : jetons de caractéristiques ===== */
.card.hv{padding:12px;cursor:pointer}
.card.hv .row{gap:12px;flex-wrap:nowrap}
.card.hv b.cap,.pu b.cap,.puh b.cap{font:800 21px/1.08 var(--fd);letter-spacing:.3px}
.img{width:64px;height:64px;border-radius:12px;background:var(--felt);color:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.chips{gap:5px;margin-top:10px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.chips span,.psx span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:44px;padding:4px 2px!important;border-radius:10px;background:var(--tok);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);box-shadow:inset 0 2px 5px rgba(0,0,0,.12);color:var(--mu);font:700 10.5px/1 system-ui,-apple-system,sans-serif!important;letter-spacing:.3px;text-align:center}
.chips span b,.psx span b{margin:0!important;font:900 20px/1 var(--fd)!important;color:var(--tx);letter-spacing:0}
.psx{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px!important;margin-top:10px!important}
.psx span.svb{border:1px dashed color-mix(in srgb,var(--ac) 60%,var(--bd));background:color-mix(in srgb,var(--ac) 10%,var(--tok));color:var(--ac)}

/* ===== en partie : unités et stratagèmes ===== */
.pu{padding:12px 12px 12px;margin-bottom:10px}
.puh{min-height:30px}
.puh .car{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tok);font-size:13px}
.pph{gap:6px;padding:2px 0 4px;scrollbar-width:none}
.pph::-webkit-scrollbar{display:none}
.pph button{min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:650;margin:0}
.pph button.on{background:radial-gradient(circle at 35% 25%,#fff3c4,#e3bd62 55%,#a37a2c);border-color:#d9b55a;color:#2b1d03}
.pg>summary,details.pg>summary{min-height:56px}
.pg>summary b,.pg>summary .cap{font:800 20px/1.1 var(--fd);letter-spacing:.3px}

/* ===== collection ===== */
.fh{border-radius:var(--r);background:var(--felt);border:1px solid rgba(255,255,255,.08);box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.4);padding:16px;gap:8px}
.fh h2{font:900 30px/1 var(--fd);text-transform:none;letter-spacing:.5px;flex-basis:100%}
.fh .b{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.2);color:#fff}
.fh .b.x{color:#ffb4a9;border-color:rgba(255,140,120,.4)}
.fh .mu2{color:#d6e6dc}
.tiles{gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tile{border-radius:14px;background-color:#1d3d2d;background-image:var(--felt);box-shadow:0 4px 12px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.1)}
.tn{font:800 14px/1.05 var(--fd);letter-spacing:.3px;padding:22px 6px 7px}

/* ===== fenêtres (fiche, dialogues, préparation) ===== */
.ov{background:rgba(4,10,7,.66)}
.pn{border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 color-mix(in srgb,#fff 7%,transparent)}
.pn h2,.pn h3.pn2,.pn .pn2{font-family:var(--fd);font-weight:800;letter-spacing:.3px}
#gp .gph{font:800 13px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:.03em;text-transform:none;color:var(--mu)}

/* ===== confort ===== */
@media(max-width:370px){header h1{font-size:22px}.chips span b,.psx span b{font-size:17px!important}main>.grid>.card:has(>[data-act=gstart])>.b{font-size:13px}}
@media(prefers-reduced-motion:reduce){.b{transition:none}}

/* ===== v88 b : titres, volets, stratagèmes, formulaires ===== */
header.hpl #cl:not(:empty)::before{content:"· "}
.card>b:first-child,.card>b.cap:first-child,.card>.row>span>b:first-child,.card>.row>b:first-child{font:800 20px/1.15 var(--fd);letter-spacing:.3px}
.row>span:has(>.b+.b){display:flex;flex-wrap:wrap;gap:8px}
.row>span:has(>.b+.b)>.b{margin:0}
.card>.row:has(>span>.b+.b){display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.card>.row:has(>span>.b+.b)>span:last-child{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.card>.row:has(>span>.b+.b)>span:last-child>.b.p{order:-1}
/* volets repliables (stratagèmes par détachement…) */
details.card{padding:0;overflow:hidden}
details.card>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:16px 50px 16px 16px;position:relative;min-height:56px;box-sizing:border-box}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary>b{font:800 21px/1.1 var(--fd);letter-spacing:.3px}
details.card>summary::after,.pg>summary::after{content:"";position:absolute;right:14px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--tok) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238fa398' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat center;transition:transform .15s}
details.card[open]>summary::after,.pg[open]>summary::after{transform:rotate(180deg)}
details.card[open]>summary{border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--ac) 6%,transparent)}
details.card>.card{margin:10px;box-shadow:none;background:color-mix(in srgb,var(--bd) 14%,var(--card))}
.pg>summary{position:relative;padding-right:52px!important}
.pg>summary .car,.pg>summary::-webkit-details-marker{display:none}
/* stratagèmes en partie */
.ps{padding:12px 14px;border-top:1px solid var(--bd)}
.psh b{font:800 19px/1.15 var(--fd);letter-spacing:.3px}
.cpb{display:inline-grid;place-items:center;min-width:46px;height:38px;padding:0 10px;border-radius:0;clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%);background:radial-gradient(circle at 40% 30%,#fff3c4,#e3bd62 55%,#a37a2c);color:#2b1d03;font:900 15px/1 var(--fd);letter-spacing:.3px}
.pre{line-height:1.5}
/* formulaires longs (import, éditeurs) */
.card>.b.p:last-child:not(:first-child),[data-act=imp]{width:100%;min-height:50px;font-size:16px;margin-top:10px}
input[type=file]{width:100%;padding:8px;border:1px dashed var(--bd);border-radius:var(--rs);background:transparent;font-size:14px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--ac);vertical-align:middle}
details.card>.card{display:flex;flex-direction:column;gap:8px}
details.card>.card>.row{display:contents}
details.card>.card>.row>span:first-child{order:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.card>.card>.pre{order:1;margin:0}
details.card>.card>.row>span:last-child{order:2;display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.card>.card>.row>span:first-child>.mu{display:inline-grid;place-items:center;min-width:46px;height:34px;padding:0 10px;clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%);background:radial-gradient(circle at 40% 30%,#fff3c4,#e3bd62 55%,#a37a2c);color:#2b1d03;font:900 14px/1 var(--fd)}
/* lanceur de dés : le bac est un morceau de table */
.dzt{background:repeating-linear-gradient(0deg,rgba(214,232,220,.05) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(214,232,220,.05) 0 1px,transparent 1px 28px),var(--felt);border:1px solid #0a110d;box-shadow:inset 0 3px 12px rgba(0,0,0,.45),0 0 0 4px color-mix(in srgb,#18241d 75%,var(--card))}
.dzt .dze{color:#cfe0d6}
/* éditeur de fiche : une arme = une petite plaque sur 3 lignes */
@media(max-width:720px){
 .w{overflow:visible!important}
 .wr{min-width:0;grid-template-columns:repeat(6,minmax(0,1fr)) 44px;gap:6px;padding:8px;margin-bottom:8px;border:1px solid var(--bd);border-radius:var(--rs);background:color-mix(in srgb,var(--bd) 14%,var(--card))}
 .wr>input{min-width:0;width:100%;text-align:center;padding:8px 4px}
 .wr>input:nth-child(1){grid-column:1/7;grid-row:1;text-align:left;font-weight:700;padding:8px 12px}
 .wr>button{grid-column:7;grid-row:1;width:44px;margin:0}
 .wr>input:nth-child(8){grid-column:1/8;text-align:left;padding:8px 12px}
}
/* historique des parties */
main>.card:has(>[data-act=gdel]){padding:14px 14px 4px;border-left:5px solid #e3bd62}
main>.card:has(>[data-act=gdel])>div:nth-of-type(2){font:800 21px/1.2 var(--fd);letter-spacing:.3px;margin:4px 40px 6px 0}
main>.card:has(>[data-act=gdel])>div:nth-of-type(2) .mu{font:500 13px system-ui,-apple-system,sans-serif}
main>.card:has(>[data-act=gdel]) .gmm{margin:8px 0;padding:8px 10px;border-radius:10px;background:var(--tok)}
main>.card:has(>[data-act=gdel])>details{border-top:1px solid var(--bd);margin:0 -14px;padding:0 14px}
main>.card:has(>[data-act=gdel])>details>summary{list-style:none;position:relative;padding:12px 40px 12px 0;margin:0;font-weight:700;font-size:14px;color:var(--tx)}
main>.card:has(>[data-act=gdel])>details>summary::-webkit-details-marker{display:none}
main>.card:has(>[data-act=gdel])>details>summary::after{content:"";position:absolute;right:0;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:var(--tok) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%238fa398' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat center}
main>.card:has(>[data-act=gdel])>details[open]>summary::after{transform:rotate(180deg)}
main>.card:has(>[data-act=gdel])>details[open]{padding-bottom:12px}

/* ===== v89 : encyclopédie des règles ===== */

 const both=jcOK(0)&&jcOK(1);
 return`<div class="jco" data-jc="bg"><div class="jcwrap" role="dialog" aria-modal="true" aria-label="Carte de mission de ${esc(B.n[pl])}">`+
 `<div class="jctop">${both?`<div class="jcs">${[0,1].map(i=>`<button type="button" class="${i===pl?"on":""}" style="--c:${CL[i]}" data-jc="pl" data-pl="${i}" aria-pressed="${i===pl}"><i></i>${esc(B.n[i])}</button>`).join("")}</div>`:`<div class="jcs"><span style="--c:${col}"><i></i>${esc(B.n[pl])}</span></div>`}<button type="button" class="jced" data-jc="edit" aria-label="Modifier la carte de mission">✎ Modifier</button><button type="button" class="jcx" data-jc="close" aria-label="Fermer">✕</button></div>`+
 `<article class="jcd" style="--c:${col}">${head}`+

/* ---------- éditeur de la carte de mission ---------- */
function jeItem(c,m){const i=c.i,I=`data-i="${i}"`;

 `<label class="jel">Quand<select data-je="mo" ${I}>${MOK.map(k=>`<option value="${k}"${c.mo===k?" selected":""}>${esc(m.MOL[k])}</option>`).join("")}</select></label>`+
 `<div class="jer${c.mo==="bat"?" off":""}"><span>Actif aux rounds</span><div>${[1,2,3,4,5].map(r=>`<button type="button" class="${c.rd.includes(r)?"on":""}" data-je="rd" ${I} data-r="${r}" aria-pressed="${c.rd.includes(r)}">R${r}</button>`).join("")}</div></div>`+
 `<label class="jel">Précision (facultatif)<input type="text" data-je="w" ${I} value="${esc(c._w||"")}" placeholder="ex. : dès le round 2"></label>`+
 (c.bo?`<div class="jeb"><b>Bonus</b><label class="jel"><input type="text" data-je="bt" ${I} value="${esc(c.bo.tx)}" aria-label="Texte du bonus"></label><label>PdV du bonus<input type="number" inputmode="numeric" min="0" max="99" data-je="bp" ${I} value="${c.bo.pts}"></label></div>`:"")+
 `<button type="button" class="jedel" data-je="del" ${I}>🗑 Supprimer cette condition</button></div>`}
function jeOpen(){const m=M(),mi=m.CO(S.bat.ms,jcPl);if(!mi)return;
 jcDraft=mi.cond.map((c,i)=>{const f=jclone(c);delete f.ch;delete f.cu;f.i=i;f._w=m.wRed(c.w)?"":(c.w||"");return f});

/* fin de l’édition : retour à la carte, ou fermeture si l’édition a été ouverte directement depuis la fiche */
function jeDone(){jcEdit=false;jcDraft=null;if(jcDirect){jcDirect=false;jcClose()}else jcDraw()}

function jeAdd(){jcDraft.push({tx:"",pts:3,k:"chk",mo:"tour",rd:[1,2,3,4,5],w:"",_w:"",r5:false,i:jcDraft.length,neu:1});jcDraw(true);const t=[...jcEl.querySelectorAll(".jee textarea")].pop();if(t){try{t.focus({preventScroll:true})}catch(_){}t.scrollIntoView({block:"center"})}}
function jeDel(i){const j=jcDraft.findIndex(c=>c.i===i);if(j<0)return;const c=jcDraft[j];if(c.neu){jcDraft.splice(j,1);jcDraft.forEach((x,k)=>{x.i=k})}else c.x=1;jcDraw(true)}
function jeSave(){
 const m=M(),mi=m.CO(S.bat.ms,jcPl);if(!mi)return;const id=mi.id,base=MSD.find(x=>x.id===id),n=base.cond.length;
 for(const c of jcDraft){if(c.x)continue;if(!String(c.tx||"").trim()){toast("Écris le texte de chaque condition");return}if(c.mo!=="bat"&&!c.rd.length){toast("Coche au moins un round : "+short(c.tx));return}}
 const cc={},a=[];
 jcDraft.forEach(c=>{const rd=c.mo==="bat"?[5]:c.rd.slice().sort((x,y)=>x-y),w=String(c._w||"").trim();
  if(c.i<n){const b=base.cond[c.i],p={};
   if(c.tx!==b.tx)p.tx=c.tx;if(c.pts!==b.pts)p.pts=c.pts;if(c.k!==b.k)p.k=c.k;if(c.mo!==b.mo){p.mo=c.mo;if(b.r5)p.r5=false}
   if(c.mo!=="bat"&&JSON.stringify(rd)!==JSON.stringify(b.rd))p.rd=rd;
   const w0=m.wRed(b.w)?"":(b.w||"");if(w!==w0)p.w=w;
   if(b.bo&&c.bo&&(c.bo.tx!==b.bo.tx||c.bo.pts!==b.bo.pts))p.bo={tx:c.bo.tx,pts:c.bo.pts};
   if(c.x)p.x=1;if(Object.keys(p).length)cc[c.i]=p}
  else{const q={tx:c.tx,pts:c.pts,k:c.k,mo:c.mo,rd,w,r5:false};if(c.x)q.x=1;a.push(q)}});
 const e=edEns();if(!Object.keys(cc).length&&!a.length)delete e.mi[id];else e.mi[id]={c:cc,a};
 if(m.msSync)m.msSync();save();draw();jeDone();toast("✎ Carte « "+mi.nm+" » modifiée")}
function jeRestore(){const m=M(),mi=m.CO(S.bat.ms,jcPl);if(!mi)return;
 ask({t:"Rétablir la carte d’origine ?",p:`Toutes les modifications de « ${mi.nm} » (textes, PdV, rounds, conditions ajoutées ou supprimées) seront annulées. Les points déjà validés sont recalculés.`,ok:"Rétablir",dg:1},()=>{const e=edEns();delete e.mi[mi.id];if(m.msSync)m.msSync();save();draw();jeDone();toast("Carte d’origine rétablie")})}
function jcDraw(keep){if(jcPl<0){jcEl.innerHTML="";return}if(!jcOK(jcPl)){jcClose();return}const old=jcEl.querySelector(".jco"),top=old?old.scrollTop:0;jcEl.innerHTML=jcHtml(jcPl);const w=jcEl.querySelector(".jco");if(w){if(jcAnim)w.classList.add("in");w.scrollTop=keep===true?top:0}jcAnim=false}
function jcClose(){jcPl=-1;jcEdit=false;jcDraft=null;jcDirect=false;jcEl.innerHTML="";if(exId===null&&catPl<0)document.body.classList.remove("jclk");if(jcFrom&&document.contains(jcFrom))try{jcFrom.focus()}catch(_){}jcFrom=null}
window.jcClose=jcClose;
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-jc]");if(!b)return;
 const a=b.dataset.jc;
 if(a==="bg"){if(e.target!==b)return;e.stopPropagation();if(!jcEdit)jcClose();return}
 e.stopPropagation();
 if(a==="open"){const pl=+b.dataset.pl;if(!jcOK(pl)){toast("Choisis d’abord les catégories de mission");return}jcFrom=b;jcPl=pl;jcEdit=false;document.body.classList.add("jclk");jcAnim=true;jcDraw();const x=jcEl.querySelector(".jcx");if(x)try{x.focus({preventScroll:true})}catch(_){}}
 else if(a==="edit0"){const pl=+b.dataset.pl;if(!jcOK(pl)){toast("Choisis d’abord les catégories de mission");return}jcFrom=b;jcPl=pl;jcEdit=false;jcDirect=true;document.body.classList.add("jclk");jcAnim=true;jeOpen();const x=jcEl.querySelector('[data-je="cancel"]');if(x)try{x.focus({preventScroll:true})}catch(_){}}
 else if(a==="pl"){jcPl=+b.dataset.pl;jcDraw()}
 else if(a==="edit")jeOpen()
 else if(a==="close")jcClose()},true);

 const a=b.dataset.je,c=jcDraft.find(x=>x.i===+b.dataset.i);
 if(a==="cancel")jeExit();else if(a==="save")jeSave();else if(a==="add")jeAdd();else if(a==="del")jeDel(+b.dataset.i);else if(a==="rst")jeRestore();
 else if(a==="rd"&&c){const r=+b.dataset.r,k=c.rd.indexOf(r);if(k>=0)c.rd.splice(k,1);else c.rd.push(r);b.classList.toggle("on",k<0);b.setAttribute("aria-pressed",k<0)}},true);

 if(k==="tx")c.tx=v;else if(k==="pts")c.pts=num(v,0,99);else if(k==="w")c._w=v;else if(k==="bt"&&c.bo)c.bo.tx=v;else if(k==="bp"&&c.bo)c.bo.pts=num(v,0,99);
 else if(k==="k")c.k=v==="cnt"?"cnt":"chk";

/* ================= v87 : la table de jeu (écran Score) ================= */
const CLB=["#3ddc97","#f0a54a"];
const tbRd=(t,i)=>{const r=S.bat.t[t];return r.p[i]+r.s[i]+(r.m?r.m[i]:0)+(r.x?r.x[i]:0)};
const tbTot=i=>S.bat.t.reduce((a,_,t)=>a+tbRd(t,i),0);
const tbSeat=()=>(M().getDw?M().getDw():0)===1?1:0;
const tbIni=n=>{const c=String(n||"").trim().charAt(0);return c?c.toUpperCase():"?"};
const CARDI='<svg viewBox="0 0 20 24" width="18" height="21" aria-hidden="true"><rect x="2" y="1.5" width="16" height="21" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 6.6l3.2 4.6-3.2 4.6-3.2-4.6z" fill="currentColor"/><circle cx="5.2" cy="5" r="1" fill="currentColor"/><circle cx="14.8" cy="19" r="1" fill="currentColor"/></svg>';
/* une zone de déploiement : nom, PC, score */
function tbZone(i,seat,T,d,sum){
 const B=S.bat,lead=d!==0&&(d>0?i===0:i===1),eq=d===0&&sum>0,nm=esc(B.n[i]),n=B.cp[i];
 return`<section class="tbz ${i===1?"o":"m"}${i===seat?" sel":""}" style="--c:${CL[i]};--cb:${CLB[i]}" data-pl="${i}">`+
  `<div class="tbh"><input class="tbn" data-bn="${i}" value="${nm}" autocomplete="off" aria-label="Nom du joueur ${i+1}">${jcOK(i)?`<button type="button" class="tbc" data-jc="open" data-pl="${i}" aria-label="Carte de mission de ${nm}" title="Carte de mission">${CARDI}</button>`:""}</div>`+
  `<div class="tbp" role="group" aria-label="Points de commandement de ${nm}"><span class="tbpl">PC</span><button type="button" data-act="bd" data-k="cp" data-t="-1" data-i="${i}" data-v="-1" aria-label="Retirer 1 point de commandement"${n<=0?" disabled":""}>−</button><span class="tbpn">${n}</span><button type="button" data-act="bd" data-k="cp" data-t="-1" data-i="${i}" data-v="1" aria-label="Ajouter 1 point de commandement">+</button></div>`+
  `<div class="tbsc"><div class="tbv">${T[i]}</div><small>PdV</small>${lead?`<span class="tbl">▲ +${Math.abs(d)}</span>`:eq?`<span class="tbl">égalité</span>`:""}</div></section>`}
/* le rail des 5 rounds, entre les deux zones */
function tbRail(c,T){
 const B=S.bat,sum=T[0]+T[1],w0=sum?Math.round(T[0]/sum*100):50;
 return`<div class="tbr" role="group" aria-label="Round de la bataille">`+B.t.map((x,t)=>{const a=tbRd(t,0),b=tbRd(t,1);return`<button type="button" class="tbj${t===c?" on":""}" data-act="bt" data-t="${t}" aria-pressed="${t===c}" aria-label="Round ${t+1} : ${esc(B.n[0])} ${a}, ${esc(B.n[1])} ${b}"><span class="tbjn"><em>R</em>${t+1}</span><small><i style="color:${CLB[0]}">${a}</i> – <i style="color:${CLB[1]}">${b}</i></small></button>`}).join("")+`<div class="tbb" aria-hidden="true"><i style="width:${w0}%;background:${CL[0]}"></i><i style="flex:1;background:${CL[1]}"></i></div></div>`}

const tbq=(ic,tt,sub,pts,body,cls)=>`<div class="tbq${cls?" "+cls:""}"><div class="tbqh"><span class="tbqi" aria-hidden="true">${ic}</span><div class="tbqt"><h3>${tt}</h3><small>${sub}</small></div><div class="tbqs"><b>${pts}</b><small>PdV</small></div></div>${body}</div>`;
function tbSheet(seat,R,rr,man){
 const B=S.bat,ms=B.ms,m=M();
 let h=`<section class="pdw open tbsh" id="tbp" role="tabpanel" aria-labelledby="tbt${seat}" style="--c:${CL[seat]};--cb:${CLB[seat]}" data-pl="${seat}">`;
 if(ms&&m.plBody)h+=tbq("🎯","Mission primaire","Round "+R,rr.m?rr.m[seat]:0,m.plBody(ms,seat,R,man[seat],rr),"tbq1");
 else h+=tbq("✎","Points à la main","Round "+R,rr.p[seat]+rr.s[seat],man[seat],"tbq1");
 h+=tbq("🎴","Objectifs secondaires","Round "+R,rr.x?rr.x[seat]:0,window.sxView(seat,R),"tbq2");
 h+=`</section>`;
 if(!ms)h+=`<div class="card msn"><div class="gph">Missions</div><p class="mu">Aucune mission suivie pour cette partie.</p><button class="b p" data-ms="enable">Suivre les missions de cette partie</button></div>`;
 return h}
/* la scène complète : plateau, onglets des joueurs, fiche du joueur choisi */
window.tbScene=man=>{
 const B=S.bat,c=B.cur||0,R=c+1,rr=B.t[c],seat=tbSeat(),T=[tbTot(0),tbTot(1)],d=T[0]-T[1],sum=T[0]+T[1];
 const tabs=`<div class="tbs" role="tablist" aria-label="Fiche du joueur">${[0,1].map(i=>`<button type="button" role="tab" id="tbt${i}" class="${i===seat?"on":""}" style="--c:${CL[i]}" data-tb="seat" data-pl="${i}" aria-selected="${i===seat}" aria-controls="tbp"><span class="tbsn" data-tbn="${i}">${esc(B.n[i])}</span><small>Round ${R} : <b>${tbRd(c,i)}</b> PdV</small></button>`).join("")}</div>`;
 return`<div class="tbt"><div class="tbm">${tbZone(1,seat,T,d,sum)}${tbRail(c,T)}${tbZone(0,seat,T,d,sum)}</div></div>`+tabs+tbSheet(seat,R,rr,man)};
/* ----- barre qui suit le défilement : scores + rounds, visible quand le plateau est sorti de l’écran ----- */

let tbkH="",tbRaf=0;
const tbHd=()=>{const h=document.querySelector("header");return h?h.offsetHeight:0};
function tbTop(){if(!document.querySelector(".tbt"))return tbHd();if(!tbkH){const h=tbTick();tbk.innerHTML=h;tbkH=h}return tbHd()+tbk.offsetHeight}
function tbTick(){
 const B=S.bat,c=B.cur||0,seat=tbSeat();
 const chip=i=>`<button type="button" class="tbkp${seat===i?" on":""}" style="--c:${CL[i]};--cb:${CLB[i]}" data-tb="seat" data-pl="${i}" data-sc="1" aria-label="Fiche de ${esc(B.n[i])} : ${tbTot(i)} points de victoire"><i aria-hidden="true">${esc(tbIni(B.n[i]))}</i><b>${tbTot(i)}</b></button>`;
 return chip(0)+`<div class="tbkr" role="group" aria-label="Round">${B.t.map((x,t)=>`<button type="button" class="${t===c?"on":""}" data-act="bt" data-t="${t}" aria-pressed="${t===c}" aria-label="Round ${t+1}">${t+1}</button>`).join("")}</div>`+chip(1)}
function tbScroll(){
 const t=document.querySelector(".tbt"),ok=!!(t&&tab==="bat"&&S.bat);
 if(!ok){tbk.classList.remove("on");return}
 /* le contenu est toujours prêt : la hauteur de la barre est donc exacte */
 const h=tbTick();if(h!==tbkH){tbk.innerHTML=h;tbkH=h}
 /* la barre apparaît quand le bas du plateau passe sous elle ; marge de 14 px avant de la masquer (évite le clignotement) */
 const lim=tbHd()+tbk.offsetHeight,bt=t.getBoundingClientRect().bottom;
 tbk.classList.toggle("on",tbk.classList.contains("on")?bt<lim+18:bt<lim+4)}
window.tbPost=()=>{document.documentElement.style.setProperty("--hh",tbHd()+"px");tbScroll()};
window.addEventListener("scroll",()=>{if(tbRaf)return;tbRaf=requestAnimationFrame(()=>{tbRaf=0;tbScroll()})},{passive:true});

function tbSeatTo(pl,sc){
 if(tbSeat()!==pl){if(M().setDw)M().setDw(pl);draw()}
 if(sc)setTimeout(()=>{const t=document.querySelector(".tbs");if(!t)return;window.scrollTo({top:Math.max(0,window.scrollY+t.getBoundingClientRect().top-tbTop()-8),behavior:"smooth"})},30)}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-tb]");if(!b)return;e.stopPropagation();
 if(b.dataset.tb==="seat")tbSeatTo(+b.dataset.pl===1?1:0,b.dataset.sc==="1")},true);

 comb:["Warhammer Community — « Du changement pour des combats toujours plus dynamiques »","https://www.warhammer-community.com/fr-fr/articles/m3son4il/new40k-du-changement-pour-des-combats-toujours-plus-dynamiques/"],
 t40:["Core Rules V11 (reproduction par section sur tactical40k.com — PDF officiel non consulté)","https://tactical40k.com/codex/rulebook"],
 dd:["Analyse des Core Rules V11 (Sprues & Brews, source secondaire)","https://spruesandbrews.com/2026/06/01/warhammer-40000-11th-edition-core-rules-deep-dive/"],
