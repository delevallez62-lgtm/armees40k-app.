r("str-explosifs","Explosifs (stratagème)",["stratageme explosifs","lancer de grenades"],"autre","","Stratagème de base, 1 PC : à votre phase de Tir, une unité amie à EXPLOSIFS/GRENADES non engagée, éligible pour tirer et qui n'a pas avancé, choisit une de ces figurines et un ennemi non engagé visible à 8\" ou moins.","On lance six D6 : chaque 4+ inflige 1 blessure mortelle à cette unité ennemie.","Votre phase de Tir ; unité qui n'a pas avancé.","","rdb","new"),
r("gen-tir-juge","Tir au jugé",["tir au juge","snap shot"],"gen","","Type de tir utilisé par Tir en état d'alerte : une seule cible ennemie visible à 24\" ou moins, chaque attaque ne touche que sur un 6 non modifié, sans relance des jets de touche.","La CT et les modificateurs ne comptent pas.","Seulement quand une règle l'autorise.","Après ce tir, l'unité ne peut plus entreprendre d'action pendant la phase.","rdb","new"),
r("gen-elan","Mouvement d'élan",["elan","mouvement d'elan","surge","surge move"],"gen","","Mouvement déclenché par certaines aptitudes : l'unité se dirige vers l'unité ennemie la plus proche et doit finir engagée avec elle si possible, sinon aussi près que possible.","La distance dépend de la règle qui l'autorise.","Règle déclenchée ; unité non ébranlée, non engagée et qui ne s'est pas déplacée cette phase.","Elle ne peut pas finir engagée avec un autre ennemi ni se déplacer à nouveau pendant la phase.","rdb","new"),
r("gen-actions","Actions",["action","actions","entreprendre une action"],"gen","","Tâches données par les missions : chaque action indique quand elle s'entreprend, quelles unités, combien de fois, quand elle s'accomplit et son effet.","Si l'unité se déplace (sauf insertion ou consolidation) ou quitte la table, l'action n'est pas accomplie.","Impossible si l'unité n'est pas sur la table, est AÉRODYNE/FORTIFICATION, ébranlée, a une CO de 0 ou « - », est engagée (sauf TITANESQUE), a avancé ou battu en retraite, ou a déjà entrepris une action ce tour.","Jusqu'à la fin du tour, l'unité ne peut ni tirer (sauf TITANESQUE) ni charger.","rdb","new"),
r("gen-effectif","Effectif initial et demi-effectif",["effectif initial","demi-effectif","demi effectif","half-strength","starting strength"],"gen","","L'effectif initial est le nombre de figurines au début du 1er round. Une unité est à demi-effectif quand il en reste exactement la moitié, en dessous quand il en reste moins.","Pour une unité d'une seule figurine, on compare ses PV restants à sa caractéristique de PV.","","Si le nombre ne se divise pas par deux, l'unité ne peut pas être « à » demi-effectif, seulement en dessous.","rdb","new"),
r("gen-ressuscite","Ressusciter des figurines",["ressuscite","ressusciter","ranimer","restituer","resurrected"],"gen","","Les figurines ressuscitées reviennent avec leur équipement et tous leurs PV, sans dépasser l'effectif initial.","Elles se placent en cohésion avec les figurines déjà sur la table, et peuvent être engagées seulement avec des ennemis déjà engagés avec l'unité.","","Un Meneur ou un Appui ressuscité reste dans son unité attachée.","rdb","new"),
r("kw-titanesque","Titanesque",["titanesque","titanic"],"kw","","Mot-clé des plus grandes figurines.","Une unité TITANESQUE peut entreprendre une action en étant engagée et peut tirer après avoir entrepris une action. Les Marcheurs super-lourds ne peuvent pas la traverser.","","Elle ne peut pas utiliser Tir en état d'alerte.","rdb","new"),
r("kw-explosifs","Explosifs / Grenades",["explosifs","grenades","grenade"],"kw","","Mot-clé des unités qui portent des grenades ou des charges explosives.","Il permet d'utiliser le stratagème de base Explosifs.","","","rdb","new"),
r("gen-repos","Unités repositionnées",["repositionnee","repositionnees","unite repositionnee","redeploy"],"gen","","Unités retirées de la table pendant la bataille et replacées en réserve stratégique par une règle.","Si elles reviennent le même tour, elles comptent toujours comme ayant avancé, battu en retraite ou débarqué. Les effets en cours continuent tant que leur condition s'applique.","","Elles ne sont pas détruites à la fin du 3e round si elles sont encore en réserve.","rdb","new"),
r("gen-pion-obj","Pion d'objectif",["pion d'objectif","pion","objective marker","marqueur d'objectif"],"gen","","Si un objectif ne tombe pas sur une zone de terrain, on le représente par un pion rond de 40 mm.","Une figurine est à portée du pion à 3\" ou moins à l'horizontale et 5\" ou moins à la verticale. On peut le traverser et finir dessus.","","","rdb","new"),
r("maj-strat-cout","Coût en PC réduit (stratagèmes)",["0pc","stratageme a 0pc","reduction de pc"],"autre","","Une règle qui permet d'utiliser un stratagème pour 0 PC sans le nommer réduit à la place son coût de 1 PC.","","Règle de faction ou de détachement qui ne nomme pas le stratagème.","","mru","new"),
r("maj-strat-multi","Stratagèmes utilisés plusieurs fois",["meme stratageme","plusieurs fois par phase"],"autre","","Une règle qui permet de réutiliser un stratagème dans la même phase, ou au-delà de sa limite par tour, round ou bataille, ne fonctionne que si elle nomme ce stratagème.","","","","mru","new"),
r("maj-strat-cible","Stratagèmes de protection contre le tir",["ne peut pas etre cible","12 pouces","18 pouces"],"autre","","Les stratagèmes qui interdisent de cibler une unité au tir au-delà de 12\" sont modifiés : l'unité peut être ciblée seulement si le tireur est à 18\" ou moins.","","","","mru","new"),
r("maj-strat-unite","Stratagèmes qui ajoutent une unité",["nouvelle unite identique","unite detruite identique"],"autre","","Un stratagème qui ajoute à l'armée une nouvelle unité identique à une unité détruite ne peut être utilisé qu'une seule fois par bataille.","","","","mru","new"),
r("maj-debarq","Débarquement d'assaut et de choc",["debarquement d'assaut","debarquement de choc"],"gen","","Si une règle permet de charger après avoir débarqué d'un TRANSPORT qui a fait un mouvement normal, l'unité fait un débarquement d'assaut (18.06). Si une règle permet de débarquer d'un TRANSPORT qui a avancé, elle fait un débarquement de choc (18.07).","","","Le détail des mouvements 18.06 et 18.07 est dans l'appli Warhammer 40,000, pas dans le PDF des Règles de Base.","mru","new")

let IMP=null;
function analyse(txt){let j;try{j=JSON.parse(txt)}catch(_){return{err:"Ce texte n'est pas un JSON valide."}}const arr=Array.isArray(j)?j:Array.isArray(j.rules)?j.rules:null;if(!arr)return{err:"Aucune liste de règles trouvée (champ « rules »)."};
 const out={add:[],upd:[],dup:[],bad:[],as:j.associations||null,ex:j.extra||null};
 for(const x of arr){if(!x||!String(x.n||"").trim()||!String(x.def||"").trim()){out.bad.push(x&&x.n||"(sans nom)");continue}
  const cur=x.id?R(x.id):null;if(cur){if(hsh(cur)!==hsh(Object.assign({},cur,x)))out.upd.push(x);continue}
  const c=cands(x.n);if(c.length)out.dup.push({x,c});else out.add.push(x)}
 return out}
function applyImp(withDup){const a=IMP;if(!a)return;let n=0;const norm=x=>{const o={};FIELDS.forEach(f=>{if(x[f]!=null)o[f]=x[f]});if(!CATN[o.cat])o.cat="autre";if(!ST[o.st])o.st="verif";return o};
 a.upd.forEach(x=>{setRule(x.id,norm(x));n++});
 a.add.forEach(x=>{const o=norm(x);if(x.id&&!R(x.id)&&!BASE[x.id]&&!E().del[x.id]){setRule(x.id,o)}else addRule(o);n++});
 if(withDup)a.dup.forEach(d=>{addRule(norm(d.x));n++});
 const e=E();if(a.as&&typeof a.as==="object")for(const k in a.as){e.as[k]=Object.assign(e.as[k]||{},a.as[k])}
 if(a.ex&&typeof a.ex==="object")for(const k in a.ex){e.ex[k]=[...new Set([...(e.ex[k]||[]),...a.ex[k]])]}
 IMP=null;dirty();ovClose();commit();toast(n+" règle(s) importée(s)")}

 ${a.length?`<h3 class="enc3">Correspondances ambiguës</h3><p class="mu">Plusieurs règles portent ce nom : rien n'est associé automatiquement. Choisis sur chaque fiche (touche le terme), ou fusionne les doublons.</p>`+a.map(g=>`<div class="encmiss"><div><b>${esc(g.t)}</b><small>${g.c.map(id=>esc(R(id).n+" ("+(CATN[R(id).cat]||"")+")")).join(" / ")} · ${g.u.length} fiche(s)</small></div></div>`).join(""):""}`)}

let encQ="",encCat="",encOpen=null,encSort="az";
function search(q,cat){const {all}=rules(),k=nk(q),kb=bk(q),out=[];
 for(const id in all){const r=all[id];if(cat&&r.cat!==cat)continue;let s=0;
  if(!k)s=1;else{const n=nk(r.n),nb=bk(r.n),al=(r.al||[]).map(bk);
   if(n===k||nb===kb)s=100;else if(al.includes(kb))s=90;else if(n.startsWith(k))s=80;else if(n.includes(k))s=60;else if(al.some(a=>a.includes(k)))s=50;
   else if(nk(r.fac).includes(k)||nk(CATN[r.cat]).includes(k))s=30;else if(nk([r.def,r.how,r.cond,r.rest].join(" ")).includes(k))s=20}
  if(s)out.push(Object.assign({_s:s},r))}
 return out.sort((a,b)=>b._s-a._s||(encSort==="az"?a.n.localeCompare(b.n,"fr"):(b.t||0)-(a.t||0)))}
function card(r,open){return`<article class="encr${open?" open":""}" data-id="${r.id}"><button type="button" class="encrh" data-enc2="tog" data-id="${r.id}" aria-expanded="${open}"><span class="encri">${CATI[r.cat]||"•"}</span><span class="encrn"><b>${esc(r.n)}</b><small>${esc(CATN[r.cat]||"")}${r.fac?" · "+esc(r.fac):""}</small>${open?"":`<span class="encrd">${esc(r.def)}</span>`}</span><span class="encrb">${badge(r)}</span></button>
 ${open?`<div class="encrx">${ruleBody(r)}${srcLine(r)}${UPD[r.id]?updBox(r.id):""}${(r.al||[]).length?`<p class="encm">Aussi reconnu sous : ${esc(r.al.filter(a=>!a.endsWith("*")).join(", "))}</p>`:""}${useBox(r.id)}
 <div class="encra"><button type="button" class="b" data-enc2="edit" data-id="${r.id}">✎ Modifier</button><button type="button" class="b" data-enc2="hist" data-id="${r.id}">🕓 Historique</button><button type="button" class="b" data-enc2="link" data-id="${r.id}">⛓ Associer à une fiche</button><button type="button" class="b x" data-enc2="del" data-id="${r.id}">Supprimer</button></div></div>`:""}</article>`}
function useBox(id){const u=usage(id);return`<p class="encm">${u.length?`Utilisée par ${u.length} fiche(s) : ${esc(u.slice(0,8).map(x=>x.n).join(", "))}${u.length>8?"…":""}`:"Aucune fiche ne l'utilise pour l'instant."}</p>`}
function updBox(id){const e=E(),cust=!!e.r[id],nb=BASE[id];return`<div class="encupd"><b>Mise à jour officielle disponible</b><p class="mu">${cust?"Tu utilises une version personnalisée : elle n'a pas été modifiée.":"L'ancienne définition reste affichée tant que tu n'as pas validé."}</p><div class="encdiff"><div><i>Nouvelle version officielle</i><p>${esc(nb.def)}</p></div></div><div class="encft">${cust?`<button type="button" class="b" data-enc2="keep" data-id="${id}">Garder ma version</button><button type="button" class="b p" data-enc2="adopt" data-id="${id}">Adopter l'officielle</button>`:`<button type="button" class="b p" data-enc2="adopt" data-id="${id}">Valider la mise à jour</button>`}</div></div>`}
function results(){const list=search(encQ,encCat);if(!list.length)return`<div class="card encempty"><p>Aucune règle ne correspond à « ${esc(encQ)} ».</p><button type="button" class="b p" data-enc2="new" data-n="${esc(encQ)}">＋ Ajouter « ${esc(encQ||"une règle")} »</button></div>`;
 if(!encQ&&!encCat&&encSort==="az"){return CATS.map(([c,n,i])=>{const a=list.filter(r=>r.cat===c);if(!a.length)return"";return`<section class="encsec"><h3><span>${i}</span>${n}<small>${a.length}</small></h3>${a.map(r=>card(r,r.id===encOpen)).join("")}</section>`}).join("")}
 return`<p class="encn">${list.length} règle(s)</p>`+list.map(r=>card(r,r.id===encOpen)).join("")}
function encHome(){const e=E(),rv=e.rv.filter(id=>R(id)).slice(0,8),rm=[...new Set(e.h.filter(h=>["ajout","modif","restau","maj"].includes(h.ty)).map(h=>h.id))].filter(id=>R(id)).slice(0,6),ms=missing(),am=ambig(),du=dups(),up=Object.keys(UPD).filter(id=>R(id));
 return`${rv.length?`<div class="encstrip"><b>Consultées récemment</b><div>${rv.map(id=>`<button type="button" class="encchip" data-enc2="go" data-id="${id}">${esc(R(id).n)}</button>`).join("")}</div></div>`:""}
 ${rm.length?`<div class="encstrip"><b>Modifiées récemment</b><div>${rm.map(id=>`<button type="button" class="encchip" data-enc2="go" data-id="${id}">${esc(R(id).n)}</button>`).join("")}</div></div>`:""}
 <div class="encalerts">${ms.length||am.length?`<button type="button" class="encal w" data-enc2="miss"><b>${ms.length}</b><span>Règles à compléter${am.length?` · ${am.length} ambiguë(s)`:""}</span></button>`:`<div class="encal ok"><b>✓</b><span>Toutes les règles de tes fiches sont reliées</span></div>`}
 ${du.length?`<button type="button" class="encal" data-enc2="dups"><b>${du.length}</b><span>Doublons ou variantes de noms</span></button>`:""}
 ${nvList().length?`<button type="button" class="encal n" data-enc2="nvv"><b>${nvList().length}</b><span>Nouvelles règles à valider</span></button>`:""}
 ${up.length?`<button type="button" class="encal u" data-enc2="upds"><b>${up.length}</b><span>Mises à jour officielles à valider</span></button>`:""}</div>`}
window.encView=()=>{const n=Object.keys(rules().all).length,c={};for(const r of Object.values(rules().all))c[r.cat]=(c[r.cat]||0)+1;
 const dets=detSrc();
 return`<div class="encw0"><div class="enctop"><div class="encti"><h2>Encyclopédie des règles</h2><small>Warhammer 40 000 V11 · ${n} entrées · vérifiées le 11/11/2026</small></div><button type="button" class="b p" data-enc2="new">＋ Ajouter une règle</button></div>
 <div class="encsearch"><input type="search" id="encq" class="encq" placeholder="Chercher une règle, un mot-clé, une faction…" value="${esc(encQ)}" autocomplete="off" aria-label="Rechercher dans l'encyclopédie"></div>
 <div class="encfil" role="group" aria-label="Catégories"><button type="button" class="${encCat?"":"on"}" data-enc2="cat" data-c="">Toutes</button>${CATS.map(([k,l,i])=>`<button type="button" class="${encCat===k?"on":""}" data-enc2="cat" data-c="${k}">${i} ${l}<small>${c[k]||0}</small></button>`).join("")}</div>
 <div class="enctools"><button type="button" class="b" data-enc2="sort">${encSort==="az"?"Tri : A → Z":"Tri : récentes"}</button><button type="button" class="b" data-enc2="histall">🕓 Historique</button><button type="button" class="b" data-enc2="io">⇅ Import / export</button></div>
 <div id="enchome">${encQ?"":encHome()}</div>
 ${encCat==="det"&&dets.length?`<div class="card encdet"><p>${dets.length} détachement(s) de tes listes ne sont pas encore dans l'encyclopédie.</p><button type="button" class="b" data-enc2="impdet">Créer leurs entrées depuis mes listes</button></div>`:""}
 <div id="encres">${results()}</div>
 <p class="encfoot">Résumés reformulés, jamais le texte intégral des règles. « Officielle vérifiée » : comparée aux PDF de Warhammer Community (Règles de Base, mises à jour universelles). « À vérifier » : règle de Codex non publiée sur le site. Le PDF officiel fait foi.</p></div>`};
function detSrc(){const have=new Set(Object.values(rules().all).filter(r=>r.cat==="det").map(r=>bk(r.n))),m=new Map();
 [...(S.dlib||[]),...(S.lists||[]).flatMap(l=>l.dets||[])].forEach(d=>{if(d&&d.name&&String(d.rule||"").trim()&&!have.has(bk(d.name))&&!m.has(bk(d.name)))m.set(bk(d.name),d)});return[...m.values()]}
function goEnc(id){const o=document.querySelector("#md .ov");if(o)o.click();encOpen=id;encQ="";encCat="";tab="enc";window.po=null;if(id)seen(id);save();draw();setTimeout(()=>{const a=document.querySelector(`.encr[data-id="${id}"]`);if(a)a.scrollIntoView({block:"center"})},50)}
window.encGo=goEnc;
function refreshRes(){const r=document.getElementById("encres"),h=document.getElementById("enchome");if(r)r.innerHTML=results();if(h)h.innerHTML=encQ?"":encHome()}
document.addEventListener("input",e=>{if(e.target.id!=="encq")return;encQ=e.target.value;refreshRes()});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-enc2]");if(!b||!document.getElementById("m").contains(b))return;e.stopPropagation();const a=b.dataset.enc2,id=b.dataset.id;
 if(a==="tog"){encOpen=encOpen===id?null:id;if(encOpen){seen(id);save()}refreshRes();return}
 if(a==="go"){encOpen=id;encQ="";seen(id);save();draw();setTimeout(()=>{const x=document.querySelector(`.encr[data-id="${id}"]`);if(x)x.scrollIntoView({block:"center"})},30);return}
 if(a==="cat"){encCat=b.dataset.c;draw();return}
 if(a==="sort"){encSort=encSort==="az"?"rec":"az";draw();return}
 if(a==="new"){editor(null,b.dataset.n?{n:b.dataset.n}:null);return}
 if(a==="edit"){editor(id);return}
 if(a==="hist"){histView(id);return}
 if(a==="histall"){histView(null);return}
 if(a==="del"){askDel(id);return}
 if(a==="link"){unitPicker(id);return}
 if(a==="io"){ioView();return}
 if(a==="miss"){missView();return}
 if(a==="dups"){const d=dups();ovOpen("dup",`<div class="ench"><h2>Doublons et variantes</h2><button type="button" class="encx" data-enc="ovclose" aria-label="Fermer">✕</button></div><p class="mu">Ces règles partagent un nom (ou presque). Modifie ou supprime celle qui est en trop ; aucune fusion n'est faite automatiquement.</p>${d.map(x=>`<div class="encmiss"><div><b>${x.near?"Noms proches":"Même nom reconnu"} : ${esc(x.k)}</b><small>${x.ids.map(i=>esc(R(i).n)+" ("+esc(CATN[R(i).cat]||"")+")").join(" / ")}</small></div><div class="encmb">${x.ids.map(i=>`<button type="button" class="b" data-enc="pk2" data-id="${i}">Voir ${esc(R(i).n)}</button>`).join("")}</div></div>`).join("")}`);return}
 if(a==="nvv"){nvView();return}
 if(a==="upds"){encQ="";encOpen=Object.keys(UPD)[0];draw();return}
 if(a==="adopt"||a==="keep"){const e2=E(),old=R(id),h=hsh(BASE[id]);if(a==="adopt"){if(e2.r[id]){hist("maj",id,old,Object.assign({},BASE[id],{kind:"base"}));delete e2.r[id]}else hist("maj",id,old,Object.assign({},BASE[id],{kind:"base"}))}else hist("maj",id,null,null,{n:old.n,keep:1});e2.ack[id]=h;delete UPD[id];commit();toast(a==="adopt"?"Version officielle adoptée (l'ancienne est dans l'historique)":"Ta version est conservée");return}
 if(a==="impdet"){const ds=detSrc();ds.forEach(d=>addRule({n:d.name,cat:"det",def:String(d.rule).trim(),src:"Mes listes (texte importé dans Hammer)",st:"verif"}));commit();toast(ds.length+" détachement(s) ajouté(s) à l'encyclopédie");return}},true);
ov.addEventListener("click",e=>{const b=e.target.closest("[data-enc=pk2]");if(!b)return;e.stopPropagation();ovClose();goEnc(b.dataset.id)});
/* ----- nouveautés officielles : pop-up Valider / Modifier / Supprimer ----- */
function nvList(){const e=E();return BASE0.filter(b=>b.st==="new"&&!e.nv[b.id]&&!e.del[b.id]&&!e.r[b.id]).map(b=>b.id)}
function nvView(){const l=nvList();if(!l.length){if(ovKind==="nv")ovClose();return}
 ovOpen("nv",`<div class="ench"><h2>Nouveautés officielles</h2><button type="button" class="encx" data-enc="ovclose" aria-label="Fermer">✕</button></div>
 <p class="mu">${l.length} nouvelle${l.length>1?"s":""} règle${l.length>1?"s":""} ajoutée${l.length>1?"s":""} depuis Warhammer Community, résumée${l.length>1?"s":""} en français. Valide, modifie ou supprime chacune.</p>
 ${l.map(id=>{const r=R(id)||BASE[id];return`<div class="encnv"><div class="encnvh"><span>${CATI[r.cat]||""}</span><b>${esc(r.n)}</b><small>${esc(CATN[r.cat]||"")}</small></div><p>${esc(r.def)}</p>${r.how?`<p class="mu">${esc(r.how)}</p>`:""}${r.rest?`<p class="mu">${esc(r.rest)}</p>`:""}<div class="encnvb"><button type="button" class="b p" data-enc="nvok" data-id="${id}">✓ Valider</button><button type="button" class="b" data-enc="nved" data-id="${id}">✎ Modifier</button><button type="button" class="b x" data-enc="nvdel" data-id="${id}">🗑 Supprimer</button></div></div>`}).join("")}
 <div class="encft"><button type="button" class="b" data-enc="ovclose">Plus tard</button><button type="button" class="b p" data-enc="nvall">Tout valider</button></div>`)}
encInit();
setTimeout(()=>{try{if(nvList().length&&ov.hidden&&!document.querySelector("#md .ov"))nvView()}catch(_){}},900);
window.__enc={rules,R,res,usage,missing,ambig,dups,bk,E,UPD:()=>UPD,setRule,addRule,delRule,restoreH,nvList,nvView};
})();

</script>
</body>
</html>
